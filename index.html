<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4b400">
  <title>DBD v0.8.5 — Drill Baby Drill</title>
  <style>
    :root{
      --bg:#111315;--panel:#1b1f22;--inset:#0f1214;--line:#343a40;
      --text:#f3efe7;--muted:#9ba1a6;--yellow:#f4b400;--yellow-dark:#856400;
      --green:#67c56a;--red:#ef5350;--blue:#70a7ff;--radius:13px;
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    button:disabled{opacity:.42;cursor:not-allowed}
    .hazard{height:7px;background:repeating-linear-gradient(135deg,var(--yellow) 0 12px,#111 12px 24px)}
    header{position:sticky;top:0;z-index:40;background:rgba(17,19,21,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
    .topbar{max-width:960px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}
    .brand{display:flex;align-items:baseline;gap:10px}.brand strong{font-size:1.8rem;letter-spacing:.06em;color:var(--yellow)}.brand span{font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
    nav{display:flex;gap:6px}nav button{padding:8px 12px;color:var(--muted);background:#171a1d;border:1px solid var(--line);border-radius:8px;font-size:.7rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}nav button.active{background:var(--yellow);border-color:var(--yellow);color:#181300}
    main{max-width:960px;margin:auto;padding:24px 18px calc(82px + var(--safe-bottom))}
    h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2rem,6vw,3.15rem);line-height:1.03;margin-bottom:9px}h2{font-size:1.3rem;margin-bottom:7px}h3{font-size:1rem;margin-bottom:6px}
    .muted{color:var(--muted)}.eyebrow{margin-bottom:7px;color:var(--yellow);font-size:.68rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
    .panel{margin-bottom:16px;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}.hero{padding:28px 22px}.hero p{max-width:740px}
    .setup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.field{margin-bottom:15px}label{display:block;margin-bottom:7px;color:var(--muted);font-size:.7rem;font-weight:850;letter-spacing:.09em;text-transform:uppercase}
    select,input,textarea{width:100%;padding:11px 12px;color:var(--text);background:var(--inset);border:1px solid var(--line);border-radius:9px;outline:none}select:focus,input:focus,textarea:focus{border-color:var(--yellow)}textarea{min-height:105px;resize:vertical}.code-input{min-height:225px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.8rem}
    .choice-row,.count-row,.actions{display:flex;flex-wrap:wrap;gap:8px}.count-row{align-items:center}.count-row input{width:92px}.actions{margin-top:18px}.actions.primary-grid{display:grid;grid-template-columns:1.5fr 1fr}.button{padding:12px 15px;color:var(--text);background:#15181b;border:1px solid var(--line);border-radius:9px;font-weight:850}.button:hover{border-color:#6d7379}.button.primary{color:#181300;background:var(--yellow);border-color:var(--yellow)}.button.small{padding:8px 10px;font-size:.78rem}.button.block{width:100%}.button.danger{color:#ff8f8c;border-color:var(--red)}
    .chip{padding:9px 12px;color:var(--muted);background:#121518;border:1px solid var(--line);border-radius:999px;font-size:.76rem;font-weight:800}.chip.active{color:#181300;background:var(--yellow);border-color:var(--yellow)}
    .binary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.binary-card{background:#131619;border:1px solid var(--line);border-radius:11px;padding:12px}.binary-card label{margin-bottom:9px}.note{color:var(--muted);font-size:.78rem;margin-top:7px}.large-note{padding:12px 13px;background:rgba(112,167,255,.08);border:1px solid rgba(112,167,255,.45);border-radius:9px;color:#cfe0ff;margin-top:14px}
    .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-bottom:16px}.stat{padding:14px;background:var(--inset);border:1px solid var(--line);border-radius:10px}.stat strong{display:block;color:var(--yellow);font-size:1.55rem}.stat span{color:var(--muted);font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .code{max-height:560px;overflow:auto;padding:15px;color:#e3ded2;background:#0d0f11;border:1px solid var(--line);border-radius:9px;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.78rem}
    .message{padding:12px 13px;margin-bottom:14px;background:var(--inset);border:1px solid var(--line);border-radius:9px}.message.error{color:#ffb4b2;border-color:var(--red)}.message.success{color:#c3f1c5;border-color:var(--green)}.message.info{border-color:var(--yellow-dark)}
    .dropzone{padding:28px 16px;text-align:center;border:1px dashed #666;background:#111416;border-radius:11px}.dropzone.drag{border-color:var(--yellow);background:rgba(244,180,0,.06)}.file-meta{margin-top:10px;color:var(--muted);font-size:.8rem}
    details.import-paste{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:#131619}details.import-paste summary{padding:13px;cursor:pointer;font-weight:800}details.import-paste>div{padding:0 13px 13px}
    .progress{height:7px;margin-bottom:15px;overflow:hidden;background:#0d0f11;border-radius:6px}.progress div{height:100%;background:var(--yellow)}
    .session-top,.question-meta,.session-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.question-meta{color:var(--muted);font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase}.timer{margin:12px 0;color:var(--yellow);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:1.35rem;font-weight:900;text-align:right}.question-limit{color:var(--muted);font-size:.72rem;text-align:right;margin-top:-9px;margin-bottom:10px}
    .question-text{margin:15px 0 20px;font-size:1.18rem;font-weight:750;line-height:1.45;white-space:pre-wrap}.choices{display:grid;gap:9px}.answer-choice{width:100%;padding:14px;color:var(--text);background:#111416;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:9px;text-align:left}.answer-choice.selected{border-left-color:var(--yellow)}.answer-choice.correct{background:rgba(104,198,107,.08);border-left-color:var(--green)}.answer-choice.wrong{background:rgba(239,83,80,.08);border-left-color:var(--red)}
    .stimulus{margin:16px 0;padding:16px;background:#111416;border:1px solid var(--line);border-radius:11px;white-space:pre-wrap;line-height:1.65}.stimulus.quote{position:relative;padding:24px 18px 18px 48px;font-size:1.02rem}.stimulus.quote:before{content:'“';position:absolute;left:14px;top:2px;color:var(--yellow);font-family:Georgia,serif;font-size:4rem;line-height:1}.stimulus-title{font-weight:900;margin-bottom:9px}.stimulus-source{margin-top:10px;color:var(--muted);font-size:.78rem;text-align:right}
    .feedback{margin-top:16px;padding:14px;background:#111416;border:1px solid var(--line);border-radius:9px}.feedback.correct{border-color:var(--green)}.feedback.wrong{border-color:var(--red)}.feedback-tag{display:inline-block;margin-bottom:8px;padding:4px 8px;border-radius:5px;font-size:.68rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase}.feedback.correct .feedback-tag{color:var(--green);background:rgba(104,198,107,.14)}.feedback.wrong .feedback-tag{color:#ff8b88;background:rgba(239,83,80,.14)}
    .error-types{display:flex;flex-wrap:wrap;gap:7px}.error-type{padding:8px 11px;color:var(--muted);background:#111416;border:1px solid var(--line);border-radius:999px;font-size:.75rem}.error-type.active{color:#181300;background:var(--yellow);border-color:var(--yellow);font-weight:900}.sticky-actions{position:sticky;bottom:calc(8px + var(--safe-bottom));z-index:20;margin-top:17px;padding:7px;background:rgba(17,19,21,.9);border-radius:12px;backdrop-filter:blur(8px)}
    .pause-overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(5,7,8,.84);backdrop-filter:blur(14px)}.pause-card{width:min(430px,100%);padding:25px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.65)}
    .preflight-background{filter:blur(4px);opacity:.55;pointer-events:none;user-select:none}.preflight-backdrop{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:18px;background:rgba(5,7,8,.52);backdrop-filter:blur(15px)}.preflight-card{width:min(540px,100%);max-height:90vh;overflow:auto;padding:25px;background:linear-gradient(180deg,#202428,#171a1d);border:1px solid #4a5056;border-radius:18px;box-shadow:0 35px 110px rgba(0,0,0,.72)}.preflight-card:before{content:'';display:block;height:6px;margin:-25px -25px 22px;background:repeating-linear-gradient(135deg,var(--yellow) 0 12px,#111 12px 24px);border-radius:18px 18px 0 0}.preflight-title{text-align:center}.preflight-title h1{font-size:2.25rem}.preflight-kicker{text-align:center;color:var(--yellow);font-weight:900;letter-spacing:.18em;font-size:.69rem;text-transform:uppercase}.manifest{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:17px 0}.manifest-item{padding:10px;background:#101315;border:1px solid var(--line);border-radius:9px}.manifest-item span{display:block;color:var(--muted);font-size:.67rem;text-transform:uppercase;letter-spacing:.08em}.manifest-item strong{display:block;margin-top:3px}.check-list{padding:0;margin:12px 0;list-style:none}.check-list li{margin:7px 0;padding-left:24px;position:relative}.check-list li:before{position:absolute;left:0;font-weight:900}.check-list.errors li:before{content:'×';color:var(--red)}.check-list.warnings li:before{content:'!';color:var(--yellow)}.check-list.good li:before{content:'✓';color:var(--green)}
    .pill{display:inline-block;margin:3px 4px 3px 0;padding:4px 8px;color:var(--muted);border:1px solid var(--line);border-radius:999px;font-size:.68rem}.session{margin-bottom:9px;padding:13px;background:var(--inset);border:1px solid var(--line);border-radius:9px}.empty{padding:28px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;text-align:center}.footer{padding:22px 10px 5px;color:var(--muted);font-size:.7rem;text-align:center}
    .report-tabs{display:flex;gap:8px;margin-bottom:16px}.report-tabs .button.active{background:var(--yellow);color:#181300;border-color:var(--yellow)}.quiz-tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.quiz-card{margin-bottom:10px;border:1px solid var(--line);border-radius:11px;background:#131619;overflow:hidden}.quiz-card summary{cursor:pointer;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:850}.quiz-card summary::-webkit-details-marker{display:none}.result-badge{padding:4px 8px;border-radius:999px;font-size:.68rem;text-transform:uppercase;letter-spacing:.07em}.result-badge.correct{color:var(--green);background:rgba(104,198,107,.13)}.result-badge.wrong{color:#ff9895;background:rgba(239,83,80,.13)}.quiz-body{padding:0 14px 16px}.quiz-answer{padding:10px;margin:8px 0;background:#0f1214;border-radius:8px}.quiz-answer.good{border-left:3px solid var(--green)}.quiz-answer.bad{border-left:3px solid var(--red)}.choice-review{padding:8px 10px;margin:6px 0;border:1px solid var(--line);border-radius:8px}.choice-review.correct-choice{border-color:var(--green)}.choice-review.user-wrong{border-color:var(--red)}
    @media(max-width:760px){.topbar{align-items:flex-start;flex-direction:column}nav{width:100%;overflow-x:auto}nav button{flex:1;white-space:nowrap}.actions.primary-grid,.setup-grid,.stats,.manifest{grid-template-columns:1fr}.binary-grid{grid-template-columns:1fr}.preflight-card{padding:21px}.preflight-card:before{margin:-21px -21px 20px}.session-top{align-items:flex-start}.question-text{font-size:1.12rem}.answer-choice{padding:15px 13px}.button{min-height:46px}}
  </style>
</head>
<body>
<div class="hazard"></div>
<header><div class="topbar"><div class="brand"><strong>DBD</strong><span>Drill Baby Drill · Gazali Edition</span></div><nav id="navigation"></nav></div></header>
<main id="application"></main>
<script>
const APP_VERSION='0.8.5';
const STORAGE_KEY='dbd_gazali';
const LARGE_PACKET_THRESHOLD=15;
const SUBJECTS=[
  {id:'chemistry',campaign:'School',name:'Kimia'},
  {id:'physics',campaign:'School',name:'Fisika'},
  {id:'matwa',campaign:'School',name:'Matematika Wajib'},
  {id:'matlan',campaign:'School',name:'Matematika Tingkat Lanjut'},
  {id:'indonesian',campaign:'School',name:'Bahasa Indonesia'},
  {id:'sat-math',campaign:'SAT',name:'SAT Math'},
  {id:'sat-rw',campaign:'SAT',name:'SAT Reading & Writing'},
  {id:'osn-geography',campaign:'OSN Geografi',name:'OSN Geografi'},
  {id:'other-school',campaign:'School',name:'Other School Subject'},
  {id:'custom',campaign:'Custom',name:'Custom'}
];
const SCOPES=[['broad','Broad'],['focused','Focused']];
const TASKS=[['check','Check knowledge'],['apply','Apply knowledge']];
const TARGETS=[['current','Current material'],['mistakes','Previous mistakes']];
const ANSWER_FORMATS=[['mcq','Multiple choice only'],['typed','Typed answer only'],['mixed','Mixed']];
const DIFFICULTIES=['Easy','Medium','Difficult','Adaptive'];
const COUNT_PRESETS=[5,10,15,20,25,60];
const FEEDBACKS=[['immediate','Immediate'],['end','After session']];
const TIMINGS=[['off','Off'],['record','Record only'],['ai','AI-set limits']];
const ERROR_TYPES=[['concept','Did not know'],['formula','Forgot rule/formula'],['method','Wrong method'],['execution','Execution/calculation'],['misread','Misread'],['careless','Careless/rushed'],['guess','Guessed'],['focus','Lost focus'],['timeout','Timed out'],['bad-question','Bad question']];

function emptyData(){return{
  appVersion:APP_VERSION,
  profile:{name:'Gazali Darmawan',grade:'Grade 11',className:'Science 2'},
  setup:{subjectId:'matlan',scope:'broad',task:'check',target:'current',answerFormat:'mcq',count:10,difficulty:'Adaptive',feedback:'immediate',timing:'off',showTimer:true,focus:''},
  statistics:{answered:0,correct:0,wrong:0},completedSessions:[],activeSession:null,pendingPacket:null,
  settings:{persistentStorageGranted:false}
}}
function migrateSetup(s){const d=emptyData().setup,out={...d,...(s||{})};if(!s)return out;if(s.testType&&!s.scope){const map={coverage:['broad','check','current'],focused:['focused','apply','current'],deep:['focused','apply','current'],repair:['focused','apply','mistakes'],mastery:['focused','apply','current'],exam:['broad','apply','current']};const v=map[s.testType]||map.coverage;out.scope=v[0];out.task=v[1];out.target=v[2]}if(!s.answerFormat)out.answerFormat=s.testType==='coverage'?'mcq':'mixed';if(s.timing==='none')out.timing='off';else if(s.timing==='question')out.timing='ai';else if(s.timing==='session')out.timing='record';return out}
function migrateActive(a){if(!a)return null;a.setupSnapshot=migrateSetup(a.setupSnapshot||{});if(a.setupSnapshot.timing==='ai'){const legacy=a.setupSnapshot.perQuestionSeconds||90;(a.packet?.questions||[]).forEach(q=>{if(!q.timeLimitSeconds)q.timeLimitSeconds=legacy})}return a}
function loadData(){try{const d=emptyData(),s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');return{...d,...s,appVersion:APP_VERSION,profile:d.profile,setup:migrateSetup(s.setup),statistics:{...d.statistics,...(s.statistics||{})},completedSessions:Array.isArray(s.completedSessions)?s.completedSessions:[],activeSession:migrateActive(s.activeSession),settings:{...d.settings,...(s.settings||{})}}}catch(e){console.error(e);return emptyData()}}
let DATA=loadData();let view='home',currentPrompt='',promptTitle='',currentSessionId=null,importError='',timerHandle=null,selectedFileName='';
if(DATA.activeSession&&!DATA.activeSession.paused&&!DATA.activeSession.locked){const a=DATA.activeSession;a.questionStarted=Date.now()-(a.questionElapsed||0)*1000}
function save(){DATA.appVersion=APP_VERSION;localStorage.setItem(STORAGE_KEY,JSON.stringify(DATA))}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(v){return String(v??'').trim().toLowerCase().replace(/\s+/g,' ')}
function fmt(sec){if(sec===null||sec===undefined||!Number.isFinite(Number(sec)))return'—';sec=Math.max(0,Math.round(sec));return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
function subject(){return SUBJECTS.find(x=>x.id===DATA.setup.subjectId)||SUBJECTS[0]}
function label(list,id){return list.find(x=>x[0]===id)?.[1]||id}
function errorLabel(id){return ERROR_TYPES.find(x=>x[0]===id)?.[1]||id||'Unclassified'}
function route(v){view=v;stopTimer();render();window.scrollTo({top:0,behavior:'smooth'})}
function renderNav(){const items=[['home','Drill'],['history','History'],['data','Data']];document.getElementById('navigation').innerHTML=items.map(([v,l])=>`<button class="${view===v?'active':''}" onclick="route('${v}')">${l}</button>`).join('')}
function updateSetup(k,v,rerender=true){if(k==='count')v=Math.max(1,Math.min(100,parseInt(v,10)||10));DATA.setup[k]=v;save();if(rerender)render()}

function scopeInstruction(v){return v==='broad'?'Sample the chosen material broadly. Distribute questions across distinct concepts and avoid repeatedly testing one detail.':'Stay on one narrow concept, skill, procedure, or error pattern and test it through meaningful variations.'}
function taskInstruction(v){return v==='check'?'Prioritize recognition, recall, distinction, and whether the concept is known or unknown. Keep the diagnostic clean.':'Prioritize solving, calculation, interpretation, reasoning, comparison, multi-step work, and transfer. Test whether I can use the knowledge independently.'}
function targetInstruction(v){return v==='mistakes'?'Use previous mistakes and unresolved weaknesses. Test the same underlying problem with fresh variants, not copied questions.':'Use the current material selected from this subject chat.'}
function answerInstruction(v){if(v==='mcq')return'Every question must be multiple choice. Do not generate short-answer, numeric-entry, or self-check questions. Use plausible, distinct choices and one clearly correct answer.';if(v==='typed')return'Every question must use a typed response. Use type "short" or "numeric". Do not include choices. Avoid self_check unless automatic grading would genuinely be dishonest.';return'Mix multiple-choice and typed-response questions only where the material benefits from both. Do not use self_check unless automatic grading would genuinely be dishonest.'}
function difficultyInstruction(d){return d==='Easy'?'Use foundations and direct applications.':d==='Medium'?'Use standard school or exam-level applications with plausible traps.':d==='Difficult'?'Use transfer, multi-step reasoning, less obvious methods, and defensible traps.':'Use a mixed difficulty profile that locates my current boundary and adjust using evidence from the chat.'}
function timingInstruction(v){if(v==='off')return'Do not include time_limit_seconds. Timing will be disabled in DBD.';if(v==='record')return'Do not impose deadlines. DBD will record how long each question takes.';return'Every question MUST include time_limit_seconds. Choose a different realistic limit for each question based on its complexity, required working, and real exam context. Do not assign one uniform time to the entire packet.'}
function deliveryInstruction(count,s){const safe=s.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');return count>LARGE_PACKET_THRESHOLD?`This is a large packet. After I confirm the material scope, create and attach a downloadable JSON file named "dbd-${safe}-${count}-questions.json". Do not paste the full ${count}-question JSON into the chat because mobile clipboards may truncate it.`:'After I confirm the material scope, you may return the JSON inline or provide it as a downloadable .json file.'}
function createPrompt(){const s=subject(),x=DATA.setup;return `I want to prepare a DBD v0.8.5 packet.\n\nConfiguration:\n- Subject: ${s.name}\n- Campaign: ${s.campaign}\n- Scope: ${label(SCOPES,x.scope)}\n- Task: ${label(TASKS,x.task)}\n- Target: ${label(TARGETS,x.target)}\n- Answer format: ${label(ANSWER_FORMATS,x.answerFormat)}\n- Questions: ${x.count}\n- Difficulty: ${x.difficulty}\n- Feedback in DBD: ${x.feedback==='immediate'?'Immediate':'After session'}\n- Timing in DBD: ${label(TIMINGS,x.timing)}\n- Additional focus: ${x.focus.trim()||'None'}\n\nDo not generate the packet yet. First inspect the files and conversation in this subject chat, then ask me exactly one material-selection question. Offer 3–6 concrete scopes grounded in the actual chat, include a custom option, briefly recommend one, and wait for my choice.\n\nAfter I choose, create exactly ${x.count} questions.\n\nScope instruction:\n${scopeInstruction(x.scope)}\n\nTask instruction:\n${taskInstruction(x.task)}\n\nTarget instruction:\n${targetInstruction(x.target)}\n\nAnswer-format instruction:\n${answerInstruction(x.answerFormat)}\n\nDifficulty instruction:\n${difficultyInstruction(x.difficulty)}\n\nTiming instruction:\n${timingInstruction(x.timing)}\n\nOutput delivery:\n${deliveryInstruction(x.count,s)}\n\nAfter the scope is confirmed, return only valid JSON or the requested JSON file. No markdown commentary around the packet.\n\nSchema:\n{\n  "dbd_version": "0.8.5",\n  "campaign": "${s.campaign}",\n  "subject": "${s.name}",\n  "topic": "selected material scope",\n  "source": "exact files, pages, lesson, test, or conversation basis",\n  "scope": "${x.scope}",\n  "task": "${x.task}",\n  "target": "${x.target}",\n  "answer_format": "${x.answerFormat}",\n  "difficulty": "${x.difficulty}",\n  "questions": [\n    {\n      "id": "q1",\n      "type": "mcq | short | numeric | self_check",\n      "time_limit_seconds": 90,\n      "stimulus": {"type": "quote | passage | context", "title": "optional", "text": "optional", "source": "optional"},\n      "prompt": "question text",\n      "choices": {"A":"...","B":"...","C":"...","D":"..."},\n      "answer": "A or expected response",\n      "accepted_answers": ["optional valid alternative"],\n      "tolerance": 0,\n      "explanation": "brief post-answer explanation",\n      "why_wrong": {"B":"specific misconception or trap"},\n      "tags": ["specific skill","specific subtopic"],\n      "difficulty": "easy | medium | hard"\n    }\n  ]\n}\n\nRules:\n- Use only the selected material, prior teaching, or explicit exam framework.\n- Keep explanations concise.\n- For quantitative work, require actual working and fresh values.\n- Do not include raw HTML.\n- Return exactly ${x.count} questions.\n- Respect the requested answer format exactly.\n- If timing is AI-set, every question must have a positive time_limit_seconds value.`}
function generatePrompt(){currentPrompt=createPrompt();promptTitle=`${subject().name} · ${label(SCOPES,DATA.setup.scope)} · ${label(TASKS,DATA.setup.task)}`;route('prompt')}

function binaryControl(title,key,items){return `<div class="binary-card"><label>${title}</label><div class="choice-row">${items.map(([id,l])=>`<button class="chip ${DATA.setup[key]===id?'active':''}" onclick="updateSetup('${key}','${id}')">${esc(l)}</button>`).join('')}</div></div>`}
function home(){const s=DATA.statistics,acc=s.answered?Math.round(s.correct/s.answered*100):0,a=DATA.activeSession,x=DATA.setup;return `
<section class="panel hero"><div class="eyebrow">DBD v0.8.5</div><h1>Configure. Import. Drill.</h1><p class="muted">Three simple decisions define what the test does. The subject chat handles understanding; DBD conducts the test and preserves the evidence.</p>
${a?`<div class="message info"><strong>Unfinished drill:</strong> ${esc(a.packet.subject)} · ${a.index+1}/${a.packet.questions.length}<div class="actions"><button class="button primary" onclick="route('drill')">CONTINUE DRILL</button></div></div>`:''}
<div class="setup-grid"><div class="field"><label>Subject / campaign</label><select onchange="updateSetup('subjectId',this.value)">${SUBJECTS.map(i=>`<option value="${i.id}" ${i.id===x.subjectId?'selected':''}>${esc(i.campaign)} — ${esc(i.name)}</option>`).join('')}</select></div><div class="field"><label>Answer format</label><div class="choice-row">${ANSWER_FORMATS.map(([id,l])=>`<button class="chip ${x.answerFormat===id?'active':''}" onclick="updateSetup('answerFormat','${id}')">${l}</button>`).join('')}</div></div></div>
<div class="binary-grid">${binaryControl('Scope','scope',SCOPES)}${binaryControl('Task','task',TASKS)}${binaryControl('Target','target',TARGETS)}</div>
<div class="setup-grid"><div class="field"><label>Questions</label><div class="count-row">${COUNT_PRESETS.map(n=>`<button class="chip ${x.count===n?'active':''}" onclick="updateSetup('count',${n})">${n}</button>`).join('')}<input type="number" min="1" max="100" value="${x.count}" onchange="updateSetup('count',this.value)"></div>${x.count>LARGE_PACKET_THRESHOLD?`<div class="large-note"><strong>Large packet:</strong> the generated request will tell ChatGPT to provide a downloadable JSON file instead of pasting the full packet into chat.</div>`:''}</div><div class="field"><label>Difficulty</label><div class="choice-row">${DIFFICULTIES.map(d=>`<button class="chip ${x.difficulty===d?'active':''}" onclick="updateSetup('difficulty','${d}')">${d}</button>`).join('')}</div></div></div>
<div class="setup-grid"><div class="field"><label>Feedback</label><div class="choice-row">${FEEDBACKS.map(([id,l])=>`<button class="chip ${x.feedback===id?'active':''}" onclick="updateSetup('feedback','${id}')">${l}</button>`).join('')}</div></div><div class="field"><label>Timing</label><div class="choice-row">${TIMINGS.map(([id,l])=>`<button class="chip ${x.timing===id?'active':''}" onclick="updateSetup('timing','${id}')">${l}</button>`).join('')}</div>${x.timing!=='off'?`<label style="margin-top:11px"><input style="width:auto;margin-right:8px" type="checkbox" ${x.showTimer?'checked':''} onchange="updateSetup('showTimer',this.checked)">Show timer during drill</label>`:''}<div class="note">${x.timing==='ai'?'The AI assigns a realistic limit to each individual question.':x.timing==='record'?'Time is recorded without a deadline.':'No time data is collected.'}</div></div></div>
<div class="field"><label>Additional focus (optional)</label><textarea placeholder="Examples: cumulative review; prioritize calculation traps; use my latest SAT mistakes..." oninput="DATA.setup.focus=this.value;save()">${esc(x.focus)}</textarea></div>
<div class="actions primary-grid"><button class="button primary" onclick="generatePrompt()">GENERATE CHAT REQUEST</button><button class="button" onclick="route('import')">IMPORT PACKET</button></div></section>
<section class="stats"><div class="stat"><strong>${s.answered}</strong><span>questions answered</span></div><div class="stat"><strong>${acc}%</strong><span>all-time accuracy</span></div><div class="stat"><strong>${DATA.completedSessions.length}</strong><span>completed drills</span></div></section>
<div class="footer">No API. Large packets use downloadable JSON files. Small packets can still be pasted.</div>`}
function promptView(){return `<section class="panel"><div class="eyebrow">Stage 1 · Subject chat</div><h1 style="font-size:2rem">${esc(promptTitle)}</h1>${DATA.setup.count>LARGE_PACKET_THRESHOLD?`<div class="message info"><strong>File delivery requested:</strong> after material selection, the chat should create a downloadable .json file rather than paste ${DATA.setup.count} questions into the conversation.</div>`:''}<div class="message info"><strong>First reply:</strong> the chat should ask which material scope to test. The packet comes only after you choose.</div><div class="code">${esc(currentPrompt)}</div><div class="actions primary-grid"><button class="button primary" onclick="copyText(currentPrompt,this)">COPY REQUEST</button><button class="button" onclick="route('import')">I HAVE THE PACKET</button></div><div class="actions"><button class="button small" onclick="route('home')">EDIT SETUP</button></div></section>`}

function importView(background=false){return `<section class="panel ${background?'preflight-background':''}"><div class="eyebrow">Stage 2 · Packet import</div><h1 style="font-size:2rem">Load the mission.</h1><p class="muted">On mobile, select a JSON file. Pasting remains available for smaller packets.</p>${importError?`<div class="message error">${esc(importError)}</div>`:''}<div id="dropzone" class="dropzone" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropFile(event)"><strong>DROP JSON HERE</strong><p class="muted">or choose a local file</p><input id="file-input" type="file" accept=".json,.txt,application/json,text/plain" style="display:none" onchange="fileChosen(this.files[0])"><button class="button primary" onclick="document.getElementById('file-input').click()">SELECT JSON FILE</button><div class="file-meta">${selectedFileName?esc(selectedFileName):'The file is read locally and is not uploaded.'}</div></div><details class="import-paste"><summary>Paste JSON instead</summary><div><textarea id="packet-input" class="code-input" placeholder="Paste the DBD packet here."></textarea><div class="actions"><button class="button" onclick="readPastedPacket()">READ PASTED JSON</button></div></div></details><div class="actions"><button class="button small" onclick="route('home')">CANCEL</button></div></section>`}
function dragOver(e){e.preventDefault();document.getElementById('dropzone')?.classList.add('drag')}function dragLeave(e){e.preventDefault();document.getElementById('dropzone')?.classList.remove('drag')}function dropFile(e){e.preventDefault();dragLeave(e);fileChosen(e.dataTransfer.files[0])}
async function fileChosen(file){if(!file)return;selectedFileName=`${file.name} · ${Math.max(1,Math.round(file.size/1024))} KB`;if(file.size>10*1024*1024){importError='File is larger than 10 MB.';render();return}try{preparePacket(await file.text(),file.name)}catch(e){importError='The file could not be read.';render()}}
function readPastedPacket(){preparePacket(document.getElementById('packet-input').value,'Pasted JSON')}
function extractJSON(raw){let t=String(raw||'').trim();const f=t.match(/```(?:json)?\s*([\s\S]*?)```/i);if(f)t=f[1].trim();try{return JSON.parse(t)}catch(e){}const starts=[t.indexOf('{'),t.indexOf('[')].filter(x=>x>=0).sort((a,b)=>a-b);for(const start of starts){const open=t[start],close=open==='{'?'}':']';let depth=0,inString=false,escaped=false;for(let i=start;i<t.length;i++){const c=t[i];if(inString){if(escaped)escaped=false;else if(c==='\\')escaped=true;else if(c==='"')inString=false}else{if(c==='"')inString=true;else if(c===open)depth++;else if(c===close){depth--;if(depth===0){try{return JSON.parse(t.slice(start,i+1))}catch(e){break}}}}}}throw new Error('No valid JSON packet could be found.')}
function normalizeStimulus(v){if(!v)return null;if(typeof v==='string')return{type:'context',title:'',text:v,source:''};if(typeof v==='object')return{type:['quote','passage','context'].includes(v.type)?v.type:'context',title:String(v.title||''),text:String(v.text||v.content||''),source:String(v.source||'')};return null}
function normalizeQuestion(q,i){const prompt=q.prompt??q.q??q.question??q.text;if(!prompt)return null;let choices=q.choices??q.options??null;if(Array.isArray(choices)){const o={};choices.forEach((v,j)=>o[String.fromCharCode(65+j)]=String(v));choices=o}else if(choices&&typeof choices==='object'){const o={};Object.entries(choices).forEach(([k,v])=>o[String(k).toUpperCase()]=String(v));choices=o}let answer=q.answer??q.correct??q.correct_answer??q.expected_answer??'';if(choices){const a=String(answer).trim();const key=Object.keys(choices).find(k=>k.toLowerCase()===a.toLowerCase())||Object.keys(choices).find(k=>String(choices[k]).trim().toLowerCase()===a.toLowerCase());if(key)answer=key}const accepted=Array.isArray(q.accepted_answers)?q.accepted_answers.map(String):[];if(answer!=='')accepted.unshift(String(answer));const rawType=String(q.type||(choices?'mcq':'short')).toLowerCase();return{id:String(q.id||`q${i+1}`),type:rawType,stimulus:normalizeStimulus(q.stimulus),prompt:String(prompt),choices,answer:String(answer),acceptedAnswers:[...new Set(accepted)],tolerance:Number.isFinite(Number(q.tolerance))?Number(q.tolerance):0,timeLimitSeconds:Number.isFinite(Number(q.time_limit_seconds??q.timeLimitSeconds))?Number(q.time_limit_seconds??q.timeLimitSeconds):null,explanation:String(q.explanation??q.reason??q.explain??''),whyWrong:q.why_wrong??q.whyWrong??q.wrong_explanations??{},tags:Array.isArray(q.tags)?q.tags.map(String):[],difficulty:String(q.difficulty||'') }}
function normalizePacket(parsed){const p=Array.isArray(parsed)?{questions:parsed}:parsed;if(!p||!Array.isArray(p.questions))throw new Error('The packet has no questions array.');const qs=p.questions.map(normalizeQuestion).filter(Boolean);if(!qs.length)throw new Error('The packet contains no valid questions.');return{dbdVersion:String(p.dbd_version||APP_VERSION),campaign:String(p.campaign||subject().campaign),subject:String(p.subject||subject().name),topic:String(p.topic||''),source:String(p.source||''),scope:String(p.scope||DATA.setup.scope),task:String(p.task||DATA.setup.task),target:String(p.target||DATA.setup.target),answerFormat:String(p.answer_format||DATA.setup.answerFormat),difficulty:String(p.difficulty||DATA.setup.difficulty),questions:qs}}
function isMCQ(q){return q.type==='mcq'||Boolean(q.choices&&Object.keys(q.choices).length)}
function validatePacket(p){const errors=[],warnings=[],ids=new Set();let mcq=0,typed=0,self=0,totalLimit=0,limits=[];p.questions.forEach((q,i)=>{const n=i+1;if(!q.prompt.trim())errors.push(`Question ${n} has no prompt.`);if(ids.has(q.id))warnings.push(`Duplicate question ID: ${q.id}.`);ids.add(q.id);if(isMCQ(q)){mcq++;const keys=Object.keys(q.choices||{});if(keys.length<2)errors.push(`Question ${n} has fewer than two choices.`);if(!keys.some(k=>norm(k)===norm(q.answer)))errors.push(`Question ${n} has an answer that does not match any choice.`);const vals=keys.map(k=>norm(q.choices[k]));if(new Set(vals).size!==vals.length)warnings.push(`Question ${n} contains duplicate answer choices.`)}else{typed++;if(!['short','numeric','self_check'].includes(q.type))errors.push(`Question ${n} uses unsupported type “${q.type}”.`);if(!q.answer&&!q.acceptedAnswers.length)errors.push(`Question ${n} has no expected answer.`);if(q.type==='self_check')self++}if(!q.explanation)warnings.push(`Question ${n} has no explanation.`);if(!q.tags.length)warnings.push(`Question ${n} has no skill tags.`);if(DATA.setup.timing==='ai'){if(!Number.isFinite(q.timeLimitSeconds)||q.timeLimitSeconds<=0)errors.push(`Question ${n} has no valid AI-set time limit.`);else{totalLimit+=q.timeLimitSeconds;limits.push(q.timeLimitSeconds)}}});if(DATA.setup.answerFormat==='mcq'&&typed)errors.push(`Answer format is Multiple choice only, but ${typed} typed question${typed===1?' was':'s were'} found.`);if(DATA.setup.answerFormat==='typed'&&mcq)errors.push(`Answer format is Typed answer only, but ${mcq} multiple-choice question${mcq===1?' was':'s were'} found.`);if(DATA.setup.feedback==='end'&&self)errors.push('Self-check questions cannot use After session feedback because they require a personal judgment before scoring.');if(p.questions.length!==DATA.setup.count)warnings.push(`You requested ${DATA.setup.count} questions, but the packet contains ${p.questions.length}.`);return{errors,warnings,counts:{mcq,typed,self,total:p.questions.length},totalLimit,limits}}
function preparePacket(raw,fileName){try{const packet=normalizePacket(extractJSON(raw)),validation=validatePacket(packet);DATA.pendingPacket={packet,validation,fileName,setupSnapshot:{...DATA.setup}};importError='';save();route('preflight')}catch(e){importError=e.message||'Could not read packet.';route('import')}}

function preflightOverlay(){const p=DATA.pendingPacket;if(!p)return'';const v=p.validation,q=p.packet.questions,limits=v.limits||[];const range=limits.length?`${Math.min(...limits)}–${Math.max(...limits)} sec`:'—';return `<div class="preflight-backdrop"><div class="preflight-card"><div class="preflight-kicker">Mission pre-flight</div><div class="preflight-title"><h1>READY TO LAUNCH</h1><p class="muted">${esc(p.packet.subject)}${p.packet.topic?` · ${esc(p.packet.topic)}`:''}</p></div><div class="manifest"><div class="manifest-item"><span>Scope</span><strong>${esc(label(SCOPES,p.setupSnapshot.scope))}</strong></div><div class="manifest-item"><span>Task</span><strong>${esc(label(TASKS,p.setupSnapshot.task))}</strong></div><div class="manifest-item"><span>Answer format</span><strong>${esc(label(ANSWER_FORMATS,p.setupSnapshot.answerFormat))}</strong></div><div class="manifest-item"><span>Questions</span><strong>${q.length}</strong></div><div class="manifest-item"><span>Feedback</span><strong>${p.setupSnapshot.feedback==='immediate'?'Immediate':'After session'}</strong></div><div class="manifest-item"><span>Timing</span><strong>${esc(label(TIMINGS,p.setupSnapshot.timing))}</strong></div>${p.setupSnapshot.timing==='ai'?`<div class="manifest-item"><span>Estimated total</span><strong>${fmt(v.totalLimit)}</strong></div><div class="manifest-item"><span>Question limits</span><strong>${range}</strong></div>`:''}</div><div class="message"><strong>Composition:</strong> ${v.counts.mcq} multiple choice · ${v.counts.typed} typed${v.counts.self?` · ${v.counts.self} self-check`:''}<br><span class="muted">Source: ${esc(p.packet.source||p.fileName||'Not specified')}</span></div>${v.errors.length?`<h3>Blocking checks</h3><ul class="check-list errors">${v.errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`:`<ul class="check-list good"><li>Packet structure is ready.</li><li>Answer format matches the setup.</li>${p.setupSnapshot.timing==='ai'?'<li>Every question has an AI-set time limit.</li>':''}</ul>`}${v.warnings.length?`<h3>Warnings</h3><ul class="check-list warnings">${v.warnings.slice(0,10).map(w=>`<li>${esc(w)}</li>`).join('')}${v.warnings.length>10?`<li>${v.warnings.length-10} more warnings.</li>`:''}</ul>`:''}<div class="actions"><button class="button primary block" ${v.errors.length?'disabled':''} onclick="launchPacket()">START DRILL</button><button class="button block" onclick="replacePacket()">REPLACE PACKET</button><button class="button block" onclick="cancelPending()">CANCEL</button></div></div></div>`}
function preflight(){return importView(true)+preflightOverlay()}
function replacePacket(){DATA.pendingPacket=null;save();route('import')}function cancelPending(){DATA.pendingPacket=null;save();route('home')}
function launchPacket(){const p=DATA.pendingPacket;if(!p||p.validation.errors.length)return;const first=p.packet.questions[0];DATA.activeSession={id:`session_${Date.now()}`,packet:p.packet,setupSnapshot:p.setupSnapshot,index:0,attempts:[],locked:false,selectedAnswer:null,typedAnswer:'',selfMarked:null,errorType:null,note:'',paused:false,startedAt:Date.now(),questionStarted:Date.now(),questionElapsed:0,questionRemaining:p.setupSnapshot.timing==='ai'?first.timeLimitSeconds:null,timedOut:false,retryKind:null};DATA.pendingPacket=null;save();route('drill')}

function currentQuestion(){const a=DATA.activeSession;return a.packet.questions[a.index]}
function stopTimer(){if(timerHandle){clearInterval(timerHandle);timerHandle=null}}
function startTimer(){stopTimer();timerHandle=setInterval(()=>{const a=DATA.activeSession;if(!a||a.paused||a.locked||view!=='drill')return;if(a.setupSnapshot.timing!=='off')a.questionElapsed=(Date.now()-a.questionStarted)/1000;if(a.setupSnapshot.timing==='ai'){a.questionRemaining=Math.max(0,(currentQuestion().timeLimitSeconds||0)-a.questionElapsed);if(a.questionRemaining<=0){timeOutQuestion();return}}updateTimer()},250)}
function updateTimer(){const a=DATA.activeSession,el=document.getElementById('timer');if(!a||!el)return;el.textContent=a.setupSnapshot.timing==='ai'?fmt(a.questionRemaining):fmt(a.questionElapsed)}
function timeOutQuestion(){const a=DATA.activeSession;if(!a||a.locked)return;a.selectedAnswer=null;a.typedAnswer='';a.locked=true;a.timedOut=true;a.errorType='timeout';a.questionElapsed=currentQuestion().timeLimitSeconds||a.questionElapsed;if(a.setupSnapshot.feedback==='end')commitAttemptAndAdvance();else{save();render()}}
function chooseAnswer(k){const a=DATA.activeSession;if(!a||a.locked||a.paused)return;a.selectedAnswer=k;lockAnswer()}
function submitTyped(){const a=DATA.activeSession;if(!a||a.locked||a.paused)return;a.typedAnswer=document.getElementById('typed-answer').value;lockAnswer()}
function lockAnswer(){const a=DATA.activeSession,q=currentQuestion();a.locked=true;if(a.setupSnapshot.timing!=='off')a.questionElapsed=(Date.now()-a.questionStarted)/1000;if(q.type==='self_check'){save();render();return}if(a.setupSnapshot.feedback==='end')commitAttemptAndAdvance();else{save();render()}}
function correctness(q){const a=DATA.activeSession;if(q.type==='self_check')return null;if(isMCQ(q))return norm(a.selectedAnswer)===norm(q.answer);if(q.type==='numeric'){const g=Number(String(a.typedAnswer).replace(',','.')),e=Number(String(q.answer).replace(',','.'));if(Number.isFinite(g)&&Number.isFinite(e))return Math.abs(g-e)<=Math.max(0,q.tolerance||0)}return q.acceptedAnswers.some(x=>norm(x)===norm(a.typedAnswer))}
function setSelfMark(v){DATA.activeSession.selfMarked=v;save();render()}function setErrorType(v){DATA.activeSession.errorType=v;save();render()}function setNote(v){DATA.activeSession.note=v;save()}
function makeAttempt(q,forcedCorrect=null,timedOut=false){const a=DATA.activeSession;let correct=forcedCorrect===null?correctness(q):forcedCorrect;if(correct===null)correct=a.selfMarked===true;return{questionId:q.id,prompt:q.prompt,stimulus:q.stimulus,type:q.type,choices:q.choices,selected:isMCQ(q)?a.selectedAnswer:a.typedAnswer,answer:q.answer,acceptedAnswers:q.acceptedAnswers,correct,elapsed:a.setupSnapshot.timing==='off'?null:a.questionElapsed,timeLimitSeconds:q.timeLimitSeconds,errorType:correct?null:(a.errorType||'unclassified'),note:a.note||'',tags:q.tags,difficulty:q.difficulty,explanation:q.explanation,whyWrong:q.whyWrong,timedOut,originalIndex:a.index,retryKind:a.retryKind||null}}
function resetForNext(){const a=DATA.activeSession,q=a.packet.questions[a.index];a.locked=false;a.selectedAnswer=null;a.typedAnswer='';a.selfMarked=null;a.errorType=null;a.note='';a.timedOut=false;a.questionStarted=Date.now();a.questionElapsed=0;a.questionRemaining=a.setupSnapshot.timing==='ai'?q.timeLimitSeconds:null}
function commitAttemptAndAdvance(){const a=DATA.activeSession,q=currentQuestion(),attempt=makeAttempt(q,null,!!a.timedOut);a.attempts.push(attempt);DATA.statistics.answered++;if(attempt.correct)DATA.statistics.correct++;else DATA.statistics.wrong++;a.index++;if(a.index>=a.packet.questions.length){finishSession();return}resetForNext();save();render()}
function nextImmediate(){const a=DATA.activeSession,q=currentQuestion(),c=correctness(q);if(c===null&&a.selfMarked===null)return;const wrong=c===false||(q.type==='self_check'&&a.selfMarked===false)||a.timedOut;if(wrong&&!a.errorType)return;commitAttemptAndAdvance()}
function pause(){const a=DATA.activeSession;if(!a)return;a.paused=true;a.pauseStarted=Date.now();save();render()}function resume(){const a=DATA.activeSession;if(!a)return;const delta=Date.now()-(a.pauseStarted||Date.now());a.questionStarted+=delta;a.paused=false;save();render()}function exitDrill(){if(confirm('Exit this drill? Progress will remain saved and can be resumed.'))route('home')}function abandonDrill(){if(confirm('Delete the active drill and all unfinished progress?')){DATA.activeSession=null;save();route('home')}}
function stimulusHTML(s){if(!s||!s.text)return'';return `<div class="stimulus ${esc(s.type)}">${s.title?`<div class="stimulus-title">${esc(s.title)}</div>`:''}${esc(s.text)}${s.source?`<div class="stimulus-source">${esc(s.source)}</div>`:''}</div>`}
function drill(){const a=DATA.activeSession;if(!a)return `<div class="empty">No active drill.</div>`;if(a.paused)return `<div class="pause-overlay"><div class="pause-card"><div class="eyebrow">Session paused</div><h1>Eyes off the question.</h1><p class="muted">The timer is stopped and the current item is hidden.</p><button class="button primary block" onclick="resume()">RESUME</button><button class="button block" style="margin-top:9px" onclick="exitDrill()">RETURN HOME</button></div></div>`;const q=currentQuestion(),total=a.packet.questions.length,c=a.locked?correctness(q):null,wrong=c===false||a.timedOut||(q.type==='self_check'&&a.selfMarked===false),immediate=a.setupSnapshot.feedback==='immediate',showFeedback=a.locked&&immediate,selfDone=q.type!=='self_check'||a.selfMarked!==null,canNext=a.locked&&selfDone&&(!wrong||a.errorType);return `<div class="progress"><div style="width:${a.index/total*100}%"></div></div><section class="panel"><div class="session-top"><div class="question-meta">${esc(a.packet.subject)} · ${a.index+1}/${total}</div><div><button class="button small" onclick="pause()">PAUSE</button> <button class="button small" onclick="exitDrill()">EXIT</button></div></div>${a.setupSnapshot.timing!=='off'&&a.setupSnapshot.showTimer?`<div class="timer" id="timer">${a.setupSnapshot.timing==='ai'?fmt(a.questionRemaining):fmt(a.questionElapsed)}</div>${a.setupSnapshot.timing==='ai'?`<div class="question-limit">AI-set limit: ${fmt(q.timeLimitSeconds)}</div>`:''}`:''}${stimulusHTML(q.stimulus)}<div class="question-text">${esc(q.prompt)}</div>${isMCQ(q)?`<div class="choices">${Object.entries(q.choices).map(([k,v])=>{let cls='answer-choice';if(showFeedback){if(k===a.selectedAnswer)cls+=' selected';if(norm(k)===norm(q.answer))cls+=' correct';else if(k===a.selectedAnswer)cls+=' wrong'}return `<button class="${cls}" ${a.locked?'disabled':''} onclick="chooseAnswer('${esc(k)}')"><strong>${esc(k)}.</strong> ${esc(v)}</button>`}).join('')}</div>`:`<div class="field"><label>Your final answer</label><input id="typed-answer" value="${esc(a.typedAnswer)}" ${a.locked?'disabled':''} placeholder="Type the final answer here"></div>${!a.locked?`<button class="button primary block" onclick="submitTyped()">SUBMIT ANSWER</button>`:''}`}${showFeedback?`<div class="feedback ${c===true?'correct':'wrong'}"><span class="feedback-tag">${a.timedOut?'Timed out':c===true?'Correct':q.type==='self_check'?'Self-check':'Wrong'}</span>${q.type==='self_check'?`<p><strong>Reference:</strong> ${esc(q.answer)}</p>${a.selfMarked===null?`<div class="actions"><button class="button small" onclick="setSelfMark(true)">I MET THE STANDARD</button><button class="button small" onclick="setSelfMark(false)">I DID NOT</button></div>`:''}`:`<p><strong>Correct answer:</strong> ${esc(q.answer)}</p>`}${q.explanation?`<p class="muted">${esc(q.explanation)}</p>`:''}${c===false&&q.whyWrong&&q.whyWrong[a.selectedAnswer]?`<p class="muted"><strong>Your trap:</strong> ${esc(q.whyWrong[a.selectedAnswer])}</p>`:''}</div>${wrong?`<div style="margin-top:17px"><label>What happened?</label><div class="error-types">${ERROR_TYPES.map(([id,l])=>`<button class="error-type ${a.errorType===id?'active':''}" onclick="setErrorType('${id}')">${esc(l)}</button>`).join('')}</div></div>`:''}<div class="field" style="margin-top:17px"><label>One-line note (optional)</label><input value="${esc(a.note||'')}" oninput="setNote(this.value)" placeholder="Example: chose the wrong method."></div><div class="sticky-actions"><button class="button primary block" ${canNext?'':'disabled'} onclick="nextImmediate()">${a.index+1===total?'FINISH DRILL':'NEXT QUESTION'} →</button></div>`:''}</section>`}

function finishSession(){const a=DATA.activeSession,correct=a.attempts.filter(x=>x.correct).length,answered=a.attempts.length,totalTime=a.setupSnapshot.timing==='off'?null:a.attempts.reduce((s,x)=>s+(x.elapsed||0),0);const session={id:a.id,completedAt:new Date().toISOString(),campaign:a.packet.campaign,subject:a.packet.subject,topic:a.packet.topic,source:a.packet.source,scope:a.packet.scope||a.setupSnapshot.scope,task:a.packet.task||a.setupSnapshot.task,target:a.packet.target||a.setupSnapshot.target,answerFormat:a.packet.answerFormat||a.setupSnapshot.answerFormat,difficulty:a.packet.difficulty,feedback:a.setupSnapshot.feedback,timing:a.setupSnapshot.timing,answered,correct,wrong:answered-correct,accuracy:answered?correct/answered*100:0,totalTime,attempts:a.attempts,retryKind:a.retryKind||null,_packetQuestions:a.packet.questions};DATA.completedSessions.unshift(session);DATA.completedSessions=DATA.completedSessions.slice(0,150);currentSessionId=session.id;DATA.activeSession=null;save();route('summary')}
function getSession(id){return DATA.completedSessions.find(x=>x.id===id)}function viewSession(id){currentSessionId=id;route('summary')}function viewFullQuiz(id){currentSessionId=id;route('quiz')}
function tagStats(s){const m={};s.attempts.forEach(a=>(a.tags?.length?a.tags:['untagged']).forEach(t=>{m[t]??={correct:0,total:0};m[t].total++;if(a.correct)m[t].correct++}));return Object.entries(m).sort((a,b)=>(a[1].correct/a[1].total)-(b[1].correct/b[1].total))}
function difficultyStats(s){const m={};s.attempts.forEach(a=>{const d=a.difficulty||'unspecified';m[d]??={correct:0,total:0};m[d].total++;if(a.correct)m[d].correct++});return Object.entries(m)}
function errorStats(s){const m={};s.attempts.filter(a=>!a.correct).forEach(a=>m[a.errorType||'unclassified']=(m[a.errorType||'unclassified']||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function slowest(s){if(s.timing==='off')return[];return [...s.attempts].filter(a=>Number.isFinite(a.elapsed)).sort((a,b)=>b.elapsed-a.elapsed).slice(0,5)}
function axesText(s){if(s.scope)return `${label(SCOPES,s.scope)} · ${label(TASKS,s.task)} · ${label(TARGETS,s.target)}`;return s.testType||'Legacy drill'}
function sessionReport(s){const tags=tagStats(s),diff=difficultyStats(s),errs=errorStats(s),wrong=s.attempts.filter(a=>!a.correct),slow=slowest(s);return `DBD SESSION REPORT\n\nCampaign: ${s.campaign}\nSubject: ${s.subject}\nTopic: ${s.topic||'—'}\nSource: ${s.source||'—'}\nDesign: ${axesText(s)}\nAnswer format: ${s.answerFormat?label(ANSWER_FORMATS,s.answerFormat):'—'}\nDifficulty: ${s.difficulty||'—'}\nFeedback: ${s.feedback==='immediate'?'Immediate':'After session'}\nTiming: ${label(TIMINGS,s.timing)}\n\nPerformance:\n- Answered: ${s.answered}\n- Correct: ${s.correct}\n- Wrong: ${s.wrong}\n- Accuracy: ${Math.round(s.accuracy)}%${s.totalTime===null?'':`\n- Total active time: ${fmt(s.totalTime)}\n- Average time/question: ${fmt(s.totalTime/s.answered)}`}\n\nAccuracy by tag:\n${tags.length?tags.map(([t,v])=>`- ${t}: ${v.correct}/${v.total} (${Math.round(v.correct/v.total*100)}%)`).join('\n'):'- none'}\n\nAccuracy by difficulty:\n${diff.length?diff.map(([d,v])=>`- ${d}: ${v.correct}/${v.total}`).join('\n'):'- none'}\n\nError causes:\n${errs.length?errs.map(([e,n])=>`- ${errorLabel(e)}: ${n}`).join('\n'):'- none'}${s.timing==='off'?'':`\n\nSlowest questions:\n${slow.map((a,i)=>`${i+1}. ${fmt(a.elapsed)} — ${a.prompt}`).join('\n')||'None.'}`}\n\nWrong questions:\n${wrong.length?wrong.map((a,i)=>`${i+1}. ${a.prompt}\nMy answer: ${a.selected||'—'}\nCorrect answer: ${a.answer}\nError: ${errorLabel(a.errorType)}\nTimed out: ${a.timedOut?'yes':'no'}\nMy note: ${a.note||'—'}\nTags: ${a.tags?.join(', ')||'—'}`).join('\n\n'):'None.'}\n\nUse this report with the subject-chat materials. Diagnose whether I need concept teaching, method repair, fresh variants, timed fluency, interpretation repair, or a focus/carelessness intervention. Do not praise question volume by itself.`}
function fullQuizText(s){return `DBD FULL QUIZ REPORT\n\nSubject: ${s.subject}\nTopic: ${s.topic||'—'}\nCompleted: ${new Date(s.completedAt).toLocaleString()}\nScore: ${s.correct}/${s.answered} (${Math.round(s.accuracy)}%)\n\n${s.attempts.map((a,i)=>`QUESTION ${i+1}\n${a.stimulus?.text?`Stimulus: ${a.stimulus.text}\n`:''}${a.prompt}\n${a.choices?Object.entries(a.choices).map(([k,v])=>`${k}. ${v}`).join('\n')+'\n':''}Your answer: ${a.selected||'—'}\nCorrect answer: ${a.answer}\nResult: ${a.correct?'Correct':a.timedOut?'Timed out':'Wrong'}\nExplanation: ${a.explanation||'—'}\nError type: ${a.correct?'—':errorLabel(a.errorType)}\nTime: ${a.elapsed===null||a.elapsed===undefined?'Not recorded':fmt(a.elapsed)}${a.timeLimitSeconds?` / limit ${fmt(a.timeLimitSeconds)}`:''}\nTags: ${a.tags?.join(', ')||'—'}\nNote: ${a.note||'—'}`).join('\n\n----------------------------------------\n\n')}`}
function download(name,text,type='text/plain'){const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function slug(s){return String(s||'dbd').replace(/\W+/g,'-').replace(/^-|-$/g,'').toLowerCase()}
function downloadTxt(id){const s=getSession(id);download(`dbd-report-${slug(s.subject)}.txt`,sessionReport(s))}function downloadJson(id){const s=getSession(id);download(`dbd-report-${slug(s.subject)}.json`,JSON.stringify(s,null,2),'application/json')}function downloadFullQuiz(id){const s=getSession(id);download(`dbd-full-quiz-${slug(s.subject)}.txt`,fullQuizText(s))}
function retrySession(id,includeSlow=false){const s=getSession(id);let selected=s.attempts.filter(a=>!a.correct);if(includeSlow&&s.timing!=='off'&&s.totalTime){const threshold=s.totalTime/s.answered*1.5;selected=[...new Map([...selected,...s.attempts.filter(a=>Number.isFinite(a.elapsed)&&a.elapsed>threshold)].map(a=>[a.questionId,a])).values()]}if(!selected.length){alert('No matching questions to retry.');return}const qmap=new Map((s._packetQuestions||[]).map(q=>[q.id,q]));const packetQuestions=selected.map(a=>qmap.get(a.questionId)).filter(Boolean);if(!packetQuestions.length){alert('This older session does not contain the original questions. Generate a fresh repair packet in the subject chat.');return}DATA.activeSession={id:`retry_${Date.now()}`,packet:{campaign:s.campaign,subject:s.subject,topic:s.topic,source:s.source,scope:'focused',task:'apply',target:'mistakes',answerFormat:s.answerFormat||'mixed',difficulty:s.difficulty,questions:packetQuestions},setupSnapshot:{...DATA.setup,scope:'focused',task:'apply',target:'mistakes',answerFormat:s.answerFormat||'mixed',feedback:'immediate',timing:'off'},index:0,attempts:[],locked:false,selectedAnswer:null,typedAnswer:'',selfMarked:null,errorType:null,note:'',paused:false,startedAt:Date.now(),questionStarted:Date.now(),questionElapsed:0,questionRemaining:null,timedOut:false,retryKind:includeSlow?'wrong_and_slow':'wrong'};save();route('drill')}
function summary(){const s=getSession(currentSessionId)||DATA.completedSessions[0];if(!s)return `<div class="empty">No completed session.</div>`;const tags=tagStats(s),errs=errorStats(s);return `<section class="panel"><div class="eyebrow">Evidence out</div><h1 style="font-size:2rem">${esc(s.subject)}${s.topic?` · ${esc(s.topic)}`:''}</h1><p class="muted">${esc(axesText(s))} · ${esc(s.difficulty)}</p><div class="stats"><div class="stat"><strong>${s.correct}/${s.answered}</strong><span>correct</span></div><div class="stat"><strong>${Math.round(s.accuracy)}%</strong><span>accuracy</span></div><div class="stat"><strong>${s.totalTime===null?'—':fmt(s.totalTime)}</strong><span>${s.totalTime===null?'timing off':'active time'}</span></div></div></section><section class="panel"><div class="report-tabs"><button class="button active">SUMMARY</button><button class="button" onclick="viewFullQuiz('${s.id}')">FULL QUIZ</button></div><h2>Weakest tags</h2>${tags.slice(0,8).map(([t,v])=>`<span class="pill">${esc(t)} · ${v.correct}/${v.total}</span>`).join('')||'<p class="muted">No tags.</p>'}<h2 style="margin-top:18px">Error causes</h2>${errs.map(([e,n])=>`<span class="pill">${esc(errorLabel(e))} · ${n}</span>`).join('')||'<p class="muted">No wrong answers.</p>'}<div class="actions primary-grid"><button class="button primary" onclick="copyText(sessionReport(getSession('${s.id}')),this)">COPY REPORT TO AI</button><button class="button" onclick="downloadTxt('${s.id}')">DOWNLOAD SUMMARY .TXT</button></div><div class="actions"><button class="button" onclick="downloadJson('${s.id}')">DOWNLOAD .JSON</button><button class="button" ${s.wrong?'':'disabled'} onclick="retrySession('${s.id}',false)">RETRY WRONG</button><button class="button" ${s.wrong||s.timing!=='off'?'':'disabled'} onclick="retrySession('${s.id}',true)">RETRY WRONG + SLOW</button></div><p class="note">Same-question retry checks whether you understood the correction. It is not fresh-variant repair.</p><button class="button block" style="margin-top:10px" onclick="route('home')">BUILD NEXT REQUEST</button></section>`}
function choiceReview(q,a){if(!q.choices)return'';return `<div>${Object.entries(q.choices).map(([k,v])=>{let cls='choice-review';if(norm(k)===norm(q.answer))cls+=' correct-choice';if(k===a.selected&&!a.correct)cls+=' user-wrong';return `<div class="${cls}"><strong>${esc(k)}.</strong> ${esc(v)}${norm(k)===norm(q.answer)?' <span class="muted">— correct</span>':''}${k===a.selected?' <span class="muted">— your answer</span>':''}</div>`}).join('')}</div>`}
function quizReport(){const s=getSession(currentSessionId)||DATA.completedSessions[0];if(!s)return `<div class="empty">No completed session.</div>`;const qmap=new Map((s._packetQuestions||[]).map(q=>[q.id,q]));return `<section class="panel"><div class="eyebrow">Complete evidence</div><h1 style="font-size:2rem">Full quiz</h1><p class="muted">${esc(s.subject)}${s.topic?` · ${esc(s.topic)}`:''} · ${s.correct}/${s.answered}</p><div class="report-tabs"><button class="button" onclick="viewSession('${s.id}')">SUMMARY</button><button class="button active">FULL QUIZ</button></div><div class="quiz-tools"><button class="button small" onclick="toggleAllQuiz(true)">EXPAND ALL</button><button class="button small" onclick="toggleAllQuiz(false)">COLLAPSE ALL</button><button class="button small" onclick="downloadFullQuiz('${s.id}')">DOWNLOAD FULL QUIZ .TXT</button></div>${s.attempts.map((a,i)=>{const q=qmap.get(a.questionId)||a;return `<details class="quiz-card"><summary><span>Q${i+1} · ${esc((a.tags||[])[0]||a.difficulty||'Question')}</span><span class="result-badge ${a.correct?'correct':'wrong'}">${a.correct?'Correct':a.timedOut?'Timed out':'Wrong'}</span></summary><div class="quiz-body">${stimulusHTML(q.stimulus||a.stimulus)}<div class="question-text">${esc(q.prompt||a.prompt)}</div>${choiceReview(q,a)}<div class="quiz-answer ${a.correct?'good':'bad'}"><strong>Your answer:</strong> ${esc(a.selected||'—')}<br><strong>Correct answer:</strong> ${esc(a.answer||q.answer||'—')}<br><strong>Result:</strong> ${a.correct?'Correct':a.timedOut?'Timed out':'Wrong'}</div><p><strong>Explanation:</strong> ${esc(a.explanation||q.explanation||'—')}</p>${!a.correct&&a.whyWrong&&a.whyWrong[a.selected]?`<p><strong>Your selected trap:</strong> ${esc(a.whyWrong[a.selected])}</p>`:''}${!a.correct?`<p><strong>Error type:</strong> ${esc(errorLabel(a.errorType))}</p>`:''}<p><strong>Time:</strong> ${a.elapsed===null||a.elapsed===undefined?'Not recorded':fmt(a.elapsed)}${a.timeLimitSeconds?` / AI limit ${fmt(a.timeLimitSeconds)}`:''}</p><p><strong>Tags:</strong> ${esc(a.tags?.join(', ')||'—')}<br><strong>Your note:</strong> ${esc(a.note||'—')}</p></div></details>`}).join('')}</section>`}
function toggleAllQuiz(open){document.querySelectorAll('.quiz-card').forEach(d=>d.open=open)}
function history(){return `<section class="panel"><div class="eyebrow">Performance record</div><h1 style="font-size:2rem">Drill history</h1><p class="muted">Every completed session can be opened as a summary or as the complete quiz.</p>${DATA.completedSessions.length?DATA.completedSessions.map(s=>`<div class="session"><div class="session-head"><div><strong>${esc(s.subject)}${s.topic?` · ${esc(s.topic)}`:''}</strong><br><small>${new Date(s.completedAt).toLocaleString()} · ${esc(s.campaign)}</small></div><div class="actions" style="margin-top:0"><button class="button small" onclick="viewSession('${s.id}')">SUMMARY</button><button class="button small" onclick="viewFullQuiz('${s.id}')">FULL QUIZ</button></div></div><div style="margin-top:9px"><span class="pill">${s.correct}/${s.answered}</span><span class="pill">${Math.round(s.accuracy)}%</span><span class="pill">${s.totalTime===null?'timing off':fmt(s.totalTime)}</span><span class="pill">${esc(axesText(s))}</span></div></div>`).join(''):`<div class="empty">No completed drills yet.</div>`}</section>`}

async function persistent(){if(!navigator.storage?.persist){alert('Persistent storage requests are not supported here.');return}DATA.settings.persistentStorageGranted=await navigator.storage.persist();save();alert(DATA.settings.persistentStorageGranted?'Persistent browser storage granted.':'Normal browser storage remains active.');render()}
function exportBackup(){save();download(`dbd-gazali-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(DATA,null,2),'application/json')}
function importBackup(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{const p=JSON.parse(await i.files[0].text());if(!p.statistics||!Array.isArray(p.completedSessions))throw new Error('Invalid DBD backup.');DATA={...emptyData(),...p,appVersion:APP_VERSION,setup:migrateSetup(p.setup),statistics:{...emptyData().statistics,...p.statistics},settings:{...emptyData().settings,...(p.settings||{})},activeSession:migrateActive(p.activeSession)};save();alert('Backup imported.');route('home')}catch(e){alert(e.message||'Import failed.')}};i.click()}
function resetData(){if(confirm('Delete all DBD progress from this browser?')){DATA=emptyData();save();route('home')}}
function dataView(){return `<section class="panel"><div class="eyebrow">Local persistence</div><h1 style="font-size:2rem">DBD remembers this browser.</h1><div class="message"><strong>Storage key:</strong> dbd_gazali<br><br><span class="muted">Same GitHub Pages origin and browser normally keep the data. Another device needs a backup import until cloud sync is added later.</span></div><div class="actions"><button class="button primary" onclick="persistent()">REQUEST PERSISTENT STORAGE</button><button class="button" onclick="exportBackup()">EXPORT BACKUP</button><button class="button" onclick="importBackup()">IMPORT BACKUP</button><button class="button danger" onclick="resetData()">RESET DATA</button></div></section>${DATA.activeSession?`<section class="panel"><h2>Active drill</h2><p class="muted">${esc(DATA.activeSession.packet.subject)} · question ${DATA.activeSession.index+1}/${DATA.activeSession.packet.questions.length}</p><div class="actions"><button class="button" onclick="route('drill')">RESUME</button><button class="button danger" onclick="abandonDrill()">DELETE ACTIVE DRILL</button></div></section>`:''}`}
async function copyText(text,button){try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}const old=button.textContent;button.textContent='COPIED ✓';setTimeout(()=>button.textContent=old,1300)}
function render(){renderNav();const views={home,prompt:promptView,import:importView,preflight,drill,summary,quiz:quizReport,history,data:dataView};document.getElementById('application').innerHTML=(views[view]||home)();if(view==='drill')startTimer()}
save();render();
</script>
</body>
</html>
