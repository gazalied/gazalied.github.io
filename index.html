<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#f4b400"
  >

  <title>DBD v0.7 — Drill Baby Drill</title>

  <style>
    :root {
      --background: #121416;
      --panel: #1c1f22;
      --inset: #101214;
      --line: #353a3f;

      --text: #f1eee7;
      --muted: #9ca2a7;

      --yellow: #f4b400;
      --yellow-dark: #826100;
      --green: #68c66b;
      --red: #ef5350;

      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;

      color: var(--text);
      background: var(--background);

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hazard {
      height: 7px;

      background:
        repeating-linear-gradient(
          135deg,
          var(--yellow) 0 12px,
          #111 12px 24px
        );
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;

      background: rgba(18, 20, 22, 0.95);
      border-bottom: 1px solid var(--line);

      backdrop-filter: blur(10px);
    }

    .topbar {
      max-width: 920px;
      margin: auto;
      padding: 14px 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand strong {
      color: var(--yellow);

      font-size: 1.8rem;
      letter-spacing: 0.06em;
    }

    .brand span {
      color: var(--muted);

      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    nav {
      display: flex;
      gap: 6px;
    }

    nav button {
      padding: 8px 12px;

      color: var(--muted);
      background: #171a1d;

      border: 1px solid var(--line);
      border-radius: 8px;

      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    nav button.active {
      color: #181300;
      background: var(--yellow);
      border-color: var(--yellow);
    }

    main {
      max-width: 920px;
      margin: auto;
      padding: 24px 18px 70px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 9px;

      font-size:
        clamp(
          2rem,
          6vw,
          3.15rem
        );

      line-height: 1.03;
    }

    h2 {
      margin-bottom: 7px;
      font-size: 1.3rem;
    }

    h3 {
      margin-bottom: 6px;
      font-size: 1rem;
    }

    .muted {
      color: var(--muted);
    }

    .eyebrow {
      margin-bottom: 7px;

      color: var(--yellow);

      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .panel {
      margin-bottom: 16px;
      padding: 20px;

      background: var(--panel);

      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .hero {
      padding: 28px 22px;
    }

    .hero p {
      max-width: 690px;
    }

    .setup-grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );

      gap: 14px;
      margin-top: 22px;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;

      color: var(--muted);

      font-size: 0.7rem;
      font-weight: 850;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    select,
    input,
    textarea {
      width: 100%;
      padding: 11px 12px;

      color: var(--text);
      background: var(--inset);

      border: 1px solid var(--line);
      border-radius: 9px;

      outline: none;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: var(--yellow);
    }

    textarea {
      min-height: 105px;
      resize: vertical;
    }

    textarea.code-input {
      min-height: 230px;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Consolas,
        monospace;

      font-size: 0.8rem;
    }

    .choice-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .chip {
      padding: 9px 12px;

      color: var(--muted);
      background: #121518;

      border: 1px solid var(--line);
      border-radius: 999px;

      font-size: 0.76rem;
      font-weight: 800;
    }

    .chip.active {
      color: #181300;
      background: var(--yellow);
      border-color: var(--yellow);
    }

    .count-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    .count-row input {
      width: 92px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;

      margin-top: 18px;
    }

    .actions.primary-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
    }

    .button {
      padding: 12px 15px;

      color: var(--text);
      background: #15181b;

      border: 1px solid var(--line);
      border-radius: 9px;

      font-weight: 850;
    }

    .button:hover {
      border-color: #6d7379;
    }

    .button.primary {
      color: #181300;
      background: var(--yellow);
      border-color: var(--yellow);
    }

    .button.small {
      padding: 8px 10px;
      font-size: 0.78rem;
    }

    .button.block {
      width: 100%;
    }

    .button.danger {
      color: #ff8f8c;
      border-color: var(--red);
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: 0.4;
    }

    .route-note {
      margin-top: 10px;

      color: var(--muted);
      font-size: 0.77rem;
    }

    .stats {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0, 1fr)
        );

      gap: 11px;
      margin-bottom: 16px;
    }

    .stat {
      padding: 14px;

      background: var(--inset);

      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .stat strong {
      display: block;

      color: var(--yellow);
      font-size: 1.55rem;
    }

    .stat span {
      color: var(--muted);

      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .code {
      max-height: 540px;
      overflow: auto;

      padding: 15px;

      color: #e3ded2;
      background: #0d0f11;

      border: 1px solid var(--line);
      border-radius: 9px;

      white-space: pre-wrap;
      word-break: break-word;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Consolas,
        monospace;

      font-size: 0.78rem;
    }

    .message {
      padding: 12px 13px;
      margin-bottom: 14px;

      background: var(--inset);

      border: 1px solid var(--line);
      border-radius: 9px;
    }

    .message.error {
      color: #ffb4b2;
      border-color: var(--red);
    }

    .message.success {
      color: #c3f1c5;
      border-color: var(--green);
    }

    .message.info {
      border-color: var(--yellow-dark);
    }

    .progress {
      height: 7px;
      margin-bottom: 15px;

      overflow: hidden;

      background: #0d0f11;
      border-radius: 6px;
    }

    .progress div {
      height: 100%;
      background: var(--yellow);
    }

    .question-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      color: var(--muted);

      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .timer {
      color: var(--yellow);

      font-family:
        ui-monospace,
        SFMono-Regular,
        Consolas,
        monospace;

      font-weight: 900;
    }

    .question-text {
      margin: 15px 0 20px;

      font-size: 1.18rem;
      font-weight: 750;
      line-height: 1.45;

      white-space: pre-wrap;
    }

    .choices {
      display: grid;
      gap: 9px;
    }

    .answer-choice {
      width: 100%;
      padding: 13px 14px;

      color: var(--text);
      background: #111416;

      border: 1px solid var(--line);
      border-left: 4px solid var(--line);
      border-radius: 9px;

      text-align: left;
    }

    .answer-choice.selected {
      border-left-color: var(--yellow);
    }

    .answer-choice.correct {
      background:
        rgba(
          104,
          198,
          107,
          0.08
        );

      border-left-color: var(--green);
    }

    .answer-choice.wrong {
      background:
        rgba(
          239,
          83,
          80,
          0.08
        );

      border-left-color: var(--red);
    }

    .feedback {
      margin-top: 16px;
      padding: 14px;

      background: #111416;

      border: 1px solid var(--line);
      border-radius: 9px;
    }

    .feedback.correct {
      border-color: var(--green);
    }

    .feedback.wrong {
      border-color: var(--red);
    }

    .feedback-tag {
      display: inline-block;
      margin-bottom: 8px;
      padding: 4px 8px;

      border-radius: 5px;

      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .feedback.correct .feedback-tag {
      color: var(--green);

      background:
        rgba(
          104,
          198,
          107,
          0.14
        );
    }

    .feedback.wrong .feedback-tag {
      color: #ff8b88;

      background:
        rgba(
          239,
          83,
          80,
          0.14
        );
    }

    .error-types {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .error-type {
      padding: 8px 11px;

      color: var(--muted);
      background: #111416;

      border: 1px solid var(--line);
      border-radius: 999px;

      font-size: 0.75rem;
    }

    .error-type.active {
      color: #181300;
      background: var(--yellow);
      border-color: var(--yellow);

      font-weight: 900;
    }

    .pill {
      display: inline-block;

      margin: 3px 4px 3px 0;
      padding: 4px 8px;

      color: var(--muted);

      border: 1px solid var(--line);
      border-radius: 999px;

      font-size: 0.68rem;
    }

    .session {
      margin-bottom: 9px;
      padding: 13px;

      background: var(--inset);

      border: 1px solid var(--line);
      border-radius: 9px;
    }

    .session-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .session small {
      color: var(--muted);
    }

    .route-grid {
      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );

      gap: 10px;
    }

    .route-card {
      padding: 13px;

      background: var(--inset);

      border: 1px solid var(--line);
      border-radius: 9px;
    }

    .route-card input {
      margin-top: 8px;
    }

    .empty {
      padding: 28px;

      color: var(--muted);

      border: 1px dashed var(--line);
      border-radius: 10px;

      text-align: center;
    }

    .footer {
      padding: 22px 10px 5px;

      color: var(--muted);

      font-size: 0.7rem;
      text-align: center;
    }

    @media (max-width: 720px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      nav {
        width: 100%;
        overflow-x: auto;
      }

      nav button {
        flex: 1;
        white-space: nowrap;
      }

      .actions.primary-grid,
      .setup-grid,
      .stats,
      .route-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="hazard"></div>

  <header>
    <div class="topbar">
      <div class="brand">
        <strong>DBD</strong>

        <span>
          Drill Baby Drill · Gazali Edition
        </span>
      </div>

      <nav id="navigation"></nav>
    </div>
  </header>

  <main id="application"></main>

  <script>
    const APP_VERSION = "0.7";

    const STORAGE_KEY =
      "dbd_gazali";

    const SUBJECTS = [
      {
        id: "chemistry",
        campaign: "School",
        name: "Kimia",
        chatLabel: "Kimia chat"
      },

      {
        id: "physics",
        campaign: "School",
        name: "Fisika",
        chatLabel: "Fisika chat"
      },

      {
        id: "matwa",
        campaign: "School",
        name: "Matematika Wajib",
        chatLabel:
          "Matematika Wajib chat"
      },

      {
        id: "matlan",
        campaign: "School",
        name:
          "Matematika Tingkat Lanjut",
        chatLabel:
          "Matematika Tingkat Lanjut chat"
      },

      {
        id: "indonesian",
        campaign: "School",
        name: "Bahasa Indonesia",
        chatLabel:
          "Bahasa Indonesia chat"
      },

      {
        id: "sat-math",
        campaign: "SAT",
        name: "SAT Math",
        chatLabel: "SAT chat"
      },

      {
        id: "sat-rw",
        campaign: "SAT",
        name:
          "SAT Reading & Writing",
        chatLabel: "SAT chat"
      },

      {
        id: "osn-geography",
        campaign: "OSN Geografi",
        name: "OSN Geografi",
        chatLabel:
          "OSN Geografi chat"
      },

      {
        id: "other-school",
        campaign: "School",
        name:
          "Other School Subject",
        chatLabel:
          "relevant school subject chat"
      },

      {
        id: "custom",
        campaign: "Custom",
        name: "Custom",
        chatLabel: "current chat"
      }
    ];

    const MODES = [
      {
        id: "coverage",
        label: "Coverage Scan",

        description:
          "Sample broadly to expose what is known, shaky, and unknown."
      },

      {
        id: "depth",
        label: "Deep Practice",

        description:
          "Use reasoning, calculations, interpretation, and transfer—not shallow recognition."
      },

      {
        id: "repair",
        label: "Repair Drill",

        description:
          "Target previous mistakes with fresh variants until the weakness is actually repaired."
      }
    ];

    const DIFFICULTIES = [
      "Easy",
      "Medium",
      "Difficult",
      "Adaptive"
    ];

    const COUNT_PRESETS = [
      5,
      10,
      15,
      20,
      25
    ];

    const ERROR_TYPES = [
      [
        "concept",
        "Did not know"
      ],

      [
        "formula",
        "Forgot rule/formula"
      ],

      [
        "method",
        "Wrong method"
      ],

      [
        "execution",
        "Execution/calculation"
      ],

      [
        "misread",
        "Misread"
      ],

      [
        "careless",
        "Careless/rushed"
      ],

      [
        "guess",
        "Guessed"
      ],

      [
        "focus",
        "Lost focus"
      ],

      [
        "bad-question",
        "Bad question"
      ]
    ];

    function createEmptyData() {
      return {
        appVersion:
          APP_VERSION,

        profile: {
          name:
            "Gazali Darmawan",

          grade:
            "Grade 11",

          className:
            "Science 2"
        },

        setup: {
          subjectId:
            "chemistry",

          mode:
            "coverage",

          count:
            10,

          difficulty:
            "Adaptive",

          focus:
            ""
        },

        statistics: {
          answered:
            0,

          correct:
            0,

          wrong:
            0
        },

        completedSessions:
          [],

        activeSession:
          null,

        settings: {
          persistentStorageGranted:
            false,

          chatRoutes:
            {}
        }
      };
    }

    function migrateLegacyData() {
      if (
        localStorage.getItem(
          STORAGE_KEY
        )
      ) {
        return;
      }

      const next =
        createEmptyData();

      const sessionKeys = [
        "dbd_gazali_sessions_v05",
        "dbd_gazali_sessions_v5"
      ];

      const activeKeys = [
        "dbd_gazali_active_v05",
        "dbd_gazali_active_v5"
      ];

      const statisticKeys = [
        "dbd_gazali_statistics_v05",
        "dbd_gazali_stats_v05",
        "dbd_gazali_statistics_v5",
        "dbd_gazali_stats_v5"
      ];

      for (
        const key
        of sessionKeys
      ) {
        try {
          const parsed =
            JSON.parse(
              localStorage.getItem(
                key
              ) || "null"
            );

          if (
            Array.isArray(
              parsed
            )
          ) {
            next.completedSessions =
              parsed;

            break;
          }
        } catch (error) {
          console.error(error);
        }
      }

      for (
        const key
        of activeKeys
      ) {
        try {
          const parsed =
            JSON.parse(
              localStorage.getItem(
                key
              ) || "null"
            );

          if (parsed) {
            next.activeSession =
              parsed;

            break;
          }
        } catch (error) {
          console.error(error);
        }
      }

      for (
        const key
        of statisticKeys
      ) {
        try {
          const parsed =
            JSON.parse(
              localStorage.getItem(
                key
              ) || "null"
            );

          if (parsed) {
            next.statistics = {
              ...next.statistics,
              ...parsed
            };

            break;
          }
        } catch (error) {
          console.error(error);
        }
      }

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(next)
      );
    }

    function loadData() {
      try {
        const defaults =
          createEmptyData();

        const stored =
          JSON.parse(
            localStorage.getItem(
              STORAGE_KEY
            ) || "{}"
          );

        return {
          ...defaults,
          ...stored,

          appVersion:
            APP_VERSION,

          profile:
            defaults.profile,

          setup: {
            ...defaults.setup,
            ...(
              stored.setup ||
              {}
            )
          },

          statistics: {
            ...defaults.statistics,
            ...(
              stored.statistics ||
              {}
            )
          },

          completedSessions:
            Array.isArray(
              stored.completedSessions
            )
              ? stored.completedSessions
              : [],

          settings: {
            ...defaults.settings,
            ...(
              stored.settings ||
              {}
            ),

            chatRoutes: {
              ...defaults
                .settings
                .chatRoutes,

              ...(
                stored.settings
                  ?.chatRoutes ||
                {}
              )
            }
          }
        };
      } catch (error) {
        console.error(error);

        return createEmptyData();
      }
    }

    migrateLegacyData();

    let DATA =
      loadData();

    let currentView =
      "home";

    let currentPrompt =
      "";

    let currentPromptTitle =
      "";

    let currentSessionId =
      null;

    let importError =
      "";

    let timerInterval =
      null;

    if (
      DATA.activeSession &&
      !DATA.activeSession.locked
    ) {
      DATA
        .activeSession
        .questionStarted =
          Date.now();

      DATA
        .activeSession
        .questionElapsed =
          0;

      saveData();
    }

    function saveData() {
      DATA.appVersion =
        APP_VERSION;

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(DATA)
      );
    }

    function escapeHTML(value) {
      return String(
        value ?? ""
      ).replace(
        /[&<>"']/g,

        character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[character]
      );
    }

    function normalizeAnswer(value) {
      return String(
        value ?? ""
      )
        .trim()
        .toLowerCase()
        .replace(
          /\s+/g,
          " "
        );
    }

    function formatDuration(
      seconds
    ) {
      const rounded =
        Math.max(
          0,
          Math.round(
            seconds || 0
          )
        );

      const minutes =
        Math.floor(
          rounded / 60
        );

      const remaining =
        String(
          rounded % 60
        ).padStart(
          2,
          "0"
        );

      return (
        `${minutes}:` +
        remaining
      );
    }

    function findSubject(
      subjectId
    ) {
      return (
        SUBJECTS.find(
          subject =>
            subject.id ===
            subjectId
        ) ||
        SUBJECTS[0]
      );
    }

    function findMode(
      modeId
    ) {
      return (
        MODES.find(
          mode =>
            mode.id ===
            modeId
        ) ||
        MODES[0]
      );
    }

    function getErrorLabel(
      errorId
    ) {
      return (
        ERROR_TYPES.find(
          item =>
            item[0] ===
            errorId
        )?.[1] ||
        errorId
      );
    }

    function route(view) {
      currentView =
        view;

      stopTimer();
      render();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function stopTimer() {
      if (timerInterval) {
        clearInterval(
          timerInterval
        );

        timerInterval =
          null;
      }
    }

    function startTimer() {
      stopTimer();

      timerInterval =
        setInterval(() => {
          const active =
            DATA.activeSession;

          if (
            active &&
            currentView ===
              "drill" &&
            !active.locked
          ) {
            active.questionElapsed =
              (
                Date.now() -
                active.questionStarted
              ) / 1000;

            const element =
              document.getElementById(
                "timer"
              );

            if (element) {
              element.textContent =
                formatDuration(
                  active.questionElapsed
                );
            }
          }
        }, 500);
    }

    function renderNavigation() {
      const items = [
        [
          "home",
          "Drill"
        ],

    function extractJSON(
      rawInput
    ) {
      let text =
        String(
          rawInput || ""
        ).trim();

      const fenced =
        text.match(
          /```(?:json)?\s*([\s\S]*?)```/i
        );

      if (fenced) {
        text =
          fenced[1].trim();
      }

      try {
        return JSON.parse(text);
      } catch (error) {
        // Continue to bracket extraction.
      }

      const starts = [
        text.indexOf("{"),
        text.indexOf("[")
      ]
        .filter(
          index =>
            index >= 0
        )
        .sort(
          (a, b) =>
            a - b
        );

      for (
        const start
        of starts
      ) {
        const opening =
          text[start];

        const closing =
          opening === "{"
            ? "}"
            : "]";

        let depth =
          0;

        let inString =
          false;

        let escaped =
          false;

        for (
          let index = start;
          index < text.length;
          index += 1
        ) {
          const character =
            text[index];

          if (inString) {
            if (escaped) {
              escaped =
                false;
            } else if (
              character === "\\"
            ) {
              escaped =
                true;
            } else if (
              character === '"'
            ) {
              inString =
                false;
            }
          } else {
            if (
              character === '"'
            ) {
              inString =
                true;
            } else if (
              character === opening
            ) {
              depth += 1;
            } else if (
              character === closing
            ) {
              depth -= 1;

              if (
                depth === 0
              ) {
                try {
                  return JSON.parse(
                    text.slice(
                      start,
                      index + 1
                    )
                  );
                } catch (error) {
                  break;
                }
              }
            }
          }
        }
      }

      throw new Error(
        "No valid JSON packet could be found."
      );
    }

    function normalizeQuestion(
      rawQuestion,
      index
    ) {
      const prompt =
        rawQuestion.prompt ??
        rawQuestion.q ??
        rawQuestion.question ??
        rawQuestion.text;

      if (!prompt) {
        return null;
      }

      let choices =
        rawQuestion.choices ??
        rawQuestion.options ??
        null;

      if (
        Array.isArray(
          choices
        )
      ) {
        const converted =
          {};

        choices.forEach(
          (
            choice,
            choiceIndex
          ) => {
            converted[
              String.fromCharCode(
                65 + choiceIndex
              )
            ] =
              String(choice);
          }
        );

        choices =
          converted;
      }

      if (
        choices &&
        typeof choices ===
          "object"
      ) {
        const normalized =
          {};

        Object.entries(
          choices
        ).forEach(
          ([key, value]) => {
            normalized[
              String(key)
                .toUpperCase()
            ] =
              String(value);
          }
        );

        choices =
          normalized;
      }

      let answer =
        rawQuestion.answer ??
        rawQuestion.correct ??
        rawQuestion.correct_answer ??
        rawQuestion.expected_answer ??
        "";

      if (choices) {
        const answerText =
          String(answer)
            .trim();

        const matchingKey =
          Object.keys(
            choices
          ).find(
            key =>
              key.toLowerCase() ===
              answerText.toLowerCase()
          )
          ??
          Object.keys(
            choices
          ).find(
            key =>
              String(
                choices[key]
              )
                .trim()
                .toLowerCase()
              ===
              answerText.toLowerCase()
          );

        if (matchingKey) {
          answer =
            matchingKey;
        }
      }

      const acceptedAnswers =
        Array.isArray(
          rawQuestion.accepted_answers
        )
          ? rawQuestion
              .accepted_answers
              .map(String)
          : [];

      if (
        answer !== ""
      ) {
        acceptedAnswers.unshift(
          String(answer)
        );
      }

      return {
        id:
          rawQuestion.id ??
          `q${index + 1}`,

        type:
          rawQuestion.type ??
          (
            choices
              ? "mcq"
              : "short"
          ),

        prompt:
          String(prompt),

        choices,

        answer:
          String(answer),

        acceptedAnswers:
          [
            ...new Set(
              acceptedAnswers
            )
          ],

        tolerance:
          Number.isFinite(
            Number(
              rawQuestion.tolerance
            )
          )
            ? Number(
                rawQuestion.tolerance
              )
            : 0,

        explanation:
          String(
            rawQuestion.explanation ??
            rawQuestion.reason ??
            rawQuestion.explain ??
            ""
          ),

        whyWrong:
          rawQuestion.why_wrong ??
          rawQuestion.whyWrong ??
          rawQuestion.wrong_explanations ??
          {},

        tags:
          Array.isArray(
            rawQuestion.tags
          )
            ? rawQuestion.tags.map(
                String
              )
            : [],

        difficulty:
          String(
            rawQuestion.difficulty ??
            ""
          )
      };
    }

    function normalizePacket(
      parsedPacket
    ) {
      const packet =
        Array.isArray(
          parsedPacket
        )
          ? {
              questions:
                parsedPacket
            }
          : parsedPacket;

      if (
        !packet ||
        !Array.isArray(
          packet.questions
        )
      ) {
        throw new Error(
          'The packet has no "questions" array.'
        );
      }

      const questions =
        packet.questions
          .map(
            normalizeQuestion
          )
          .filter(Boolean);

      if (
        questions.length === 0
      ) {
        throw new Error(
          "The packet contains no valid questions."
        );
      }

      return {
        dbdVersion:
          packet.dbd_version ??
          APP_VERSION,

        campaign:
          packet.campaign ??
          "Custom",

        subject:
          packet.subject ??
          findSubject(
            DATA.setup.subjectId
          ).name,

        topic:
          packet.topic ??
          "",

        source:
          packet.source ??
          "",

        mode:
          packet.mode ??
          DATA.setup.mode,

        difficulty:
          packet.difficulty ??
          DATA.setup.difficulty,

        questions
      };
    }

        document.getElementById(
          "typed-answer"
        ).value;

      active.locked =
        true;

      active.questionElapsed =
        (
          Date.now() -
          active.questionStarted
        ) / 1000;

      saveData();
      render();
    }

    function setSelfMark(
      value
    ) {
      DATA
        .activeSession
        .selfMarked =
          value;

      saveData();
      render();
    }

    function setErrorType(
      value
    ) {
      DATA
        .activeSession
        .errorType =
          value;

      saveData();
      render();
    }

    function updateActiveNote(
      value
    ) {
      DATA
        .activeSession
        .note =
          value;

      saveData();
    }

    function getCorrectness(
      question
    ) {
      const active =
        DATA.activeSession;

      if (
        question.type ===
        "self_check"
      ) {
        return null;
      }

      if (
        isMultipleChoice(
          question
        )
      ) {
        return (
          normalizeAnswer(
            active.selectedAnswer
          )
          ===
          normalizeAnswer(
            question.answer
          )
        );
      }

      if (
        question.type ===
        "numeric"
      ) {
        const given =
          Number(
            String(
              active.typedAnswer
            ).replace(
              ",",
              "."
            )
          );

        const expected =
          Number(
            String(
              question.answer
            ).replace(
              ",",
              "."
            )
          );

        if (
          Number.isFinite(given) &&
          Number.isFinite(expected)
        ) {
          return (
            Math.abs(
              given -
              expected
            )
            <=
            Math.max(
              0,
              question.tolerance ||
              0
            )
          );
        }
      }

      return (
        question
          .acceptedAnswers
          .some(
            answer =>
              normalizeAnswer(
                active.typedAnswer
              )
              ===
              normalizeAnswer(
                answer
              )
          )
      );
    }

    function saveAndContinue() {
      const active =
        DATA.activeSession;

      const question =
        currentQuestion();

      let correct =
        getCorrectness(
          question
        );

      if (
        correct === null
      ) {
        correct =
          active.selfMarked ===
          true;
      }

      active.attempts.push({
        questionId:
          question.id,

        prompt:
          question.prompt,

        type:
          question.type,

        selected:
          isMultipleChoice(
            question
          )
            ? active.selectedAnswer
            : active.typedAnswer,

        answer:
          question.answer,

        correct,

        elapsed:
          active.questionElapsed,

        errorType:
          correct
            ? null
            : (
                active.errorType ||
                "unclassified"
              ),

        note:
          active.note || "",

        tags:
          question.tags,

        difficulty:
          question.difficulty,

        explanation:
          question.explanation
      });

      DATA
        .statistics
        .answered += 1;

      if (correct) {
        DATA
          .statistics
          .correct += 1;
      } else {
        DATA
          .statistics
          .wrong += 1;
      }

      active.index += 1;

      if (
        active.index >=
        active
          .packet
          .questions
          .length
      ) {
        finishSession();
        return;
      }

      active.locked =
        false;

      active.selectedAnswer =
        null;

      active.typedAnswer =
        "";

      active.selfMarked =
        null;

      active.errorType =
        null;

      active.note =
        "";

      active.questionStarted =
        Date.now();

      active.questionElapsed =
        0;

      saveData();
      render();
    }

    function finishSession() {
      const active =
        DATA.activeSession;

      const correct =
        active
          .attempts
          .filter(
            attempt =>
              attempt.correct
          )
          .length;

      const answered =
        active
          .attempts
          .length;

      const totalTime =
        active
          .attempts
          .reduce(
            (
              sum,
              attempt
            ) =>
              sum +
              (
                attempt.elapsed ||
                0
              ),

            0
          );

      const session = {
        id:
          active.id,

        completedAt:
          new Date()
            .toISOString(),

        campaign:
          active.packet.campaign,

        subject:
          active.packet.subject,

        topic:
          active.packet.topic,

        source:
          active.packet.source,

        mode:
          active.packet.mode,

        difficulty:
          active.packet.difficulty,

        answered,

        correct,

        wrong:
          answered - correct,

        accuracy:
          answered
            ? (
                correct /
                answered
              ) * 100
            : 0,

        totalTime,

        attempts:
          active.attempts
      };

      DATA
        .completedSessions
        .unshift(
          session
        );

      DATA.completedSessions =
        DATA
          .completedSessions
          .slice(
            0,
            100
          );

      currentSessionId =
        session.id;

      DATA.activeSession =
        null;

      saveData();

      route(
        "summary"
      );
    }

    function getSession(
      sessionId
    ) {
      return (
        DATA
          .completedSessions
          .find(
            session =>
              session.id ===
              sessionId
          )
      );
    }

    function viewSession(
      sessionId
    ) {

      );
    }

    function summarizeWeakTags(
      session
    ) {
      const counts =
        {};

      session.attempts
        .filter(
          attempt =>
            !attempt.correct
        )
        .forEach(
          attempt => {
            const tags =
              attempt.tags?.length
                ? attempt.tags
                : ["untagged"];

            tags.forEach(
              tag => {
                counts[tag] =
                  (
                    counts[tag] ||
                    0
                  ) + 1;
              }
            );
          }
        );

      return Object.entries(
        counts
      )
        .sort(
          (a, b) =>
            b[1] - a[1]
        )
        .slice(
          0,
          8
        );
    }

    function summarizeErrorTypes(
      session
    ) {
      const counts =
        {};

      session.attempts
        .filter(
          attempt =>
            !attempt.correct
        )
        .forEach(
          attempt => {
            const errorType =
              attempt.errorType ||
              "unclassified";

            counts[errorType] =
              (
                counts[errorType] ||
                0
              ) + 1;
          }
        );

      return Object.entries(
        counts
      ).sort(
        (a, b) =>
          b[1] - a[1]
      );
    }

    function createSessionReport(
      session
    ) {
      const weakTags =
        summarizeWeakTags(
          session
        );

      const errorTypes =
        summarizeErrorTypes(
          session
        );

      const wrongAttempts =
        session.attempts.filter(
          attempt =>
            !attempt.correct
        );

      const averageTime =
        session.answered
          ? (
              session.totalTime /
              session.answered
            )
          : 0;

      return `
DBD SESSION REPORT

Campaign: ${session.campaign}
Subject: ${session.subject}
Topic: ${session.topic || "—"}
Source: ${session.source || "—"}
Mode: ${session.mode || "—"}
Difficulty: ${session.difficulty || "—"}

Performance:

- Answered: ${session.answered}
- Correct: ${session.correct}
- Wrong: ${session.wrong}
- Accuracy: ${Math.round(session.accuracy)}%
- Total active question time: ${formatDuration(session.totalTime)}
- Average time/question: ${formatDuration(averageTime)}

Weak tags:

${
  weakTags.length
    ? weakTags
        .map(
          ([tag, count]) =>
            `- ${tag}: ${count} miss${count === 1 ? "" : "es"}`
        )
        .join("\n")
    : "- none"
}

Error causes:

${
  errorTypes.length
    ? errorTypes
        .map(
          ([errorType, count]) =>
            `- ${getErrorLabel(errorType)}: ${count}`
        )
        .join("\n")
    : "- none"
}

Wrong questions:

${
  wrongAttempts.length
    ? wrongAttempts
        .map(
          (attempt, index) => `
${index + 1}. ${attempt.prompt}
My answer: ${attempt.selected || "—"}
Correct answer: ${attempt.answer}
Time: ${formatDuration(attempt.elapsed)}
Error: ${getErrorLabel(attempt.errorType)}
My note: ${attempt.note || "—"}
Tags: ${attempt.tags?.join(", ") || "—"}
          `.trim()
        )
        .join("\n\n")
    : "None."
}

Use this report together with the files and prior conversation in this subject chat.

Diagnose whether I need:

1. concept teaching;
2. easier scaffolding;
3. fresh variants;
4. timed fluency;
5. method repair;
6. interpretation repair; or
7. a focus/carelessness intervention.

Do not praise question volume by itself.

Judge whether the learning loop has actually closed.
      `.trim();
    }

Use the materials and conversation already available in this subject chat.

Here is my latest DBD report:

${createSessionReport(session)}

First diagnose the failure through active conversation.

    async function requestPersistentStorage() {
      if (
        !navigator.storage ||
        !navigator.storage.persist
      ) {
        alert(
          "This browser does not support persistent-storage requests."
        );

        return;
      }

      const granted =
        await navigator
          .storage
          .persist();

      DATA
        .settings
        .persistentStorageGranted =
          granted;

      saveData();

      alert(
        granted
          ? "Persistent browser storage was granted."
          : "The browser kept normal storage behavior. Backups are still recommended."
      );

      render();
    }

    function saveChatRoutes() {
      const routes = {
        ...DATA
          .settings
          .chatRoutes
      };

      SUBJECTS.forEach(
        subject => {
          const input =
            document.getElementById(
              `route-${subject.id}`
            );

          if (input) {
            routes[subject.id] =
              input.value.trim();
          }
        }
      );

      DATA.settings.chatRoutes =
        routes;

      saveData();

      alert(
        "Chat routes saved."
      );

      render();
    }

    function exportBackup() {
      saveData();

      const blob =
        new Blob(
          [
            JSON.stringify(
              DATA,
              null,
              2
            )
          ],

          {
            type:
              "application/json"
          }
        );

      const url =
        URL.createObjectURL(
          blob
        );

      const anchor =
        document.createElement(
          "a"
        );

      anchor.href =
        url;

      anchor.download =
        `dbd-gazali-backup-${
          new Date()
            .toISOString()
            .slice(
              0,
              10
            )
        }.json`;

      anchor.click();

      URL.revokeObjectURL(
        url
      );
    }

    function importBackup() {
      const input =
        document.createElement(
          "input"
        );

      input.type =
        "file";

      input.accept =
        ".json,application/json";

      input.onchange =
        async () => {
          try {
            const file =
              input.files[0];

            if (!file) {
              return;
            }

            const parsed =
              JSON.parse(
                await file.text()
              );

            if (
              !parsed.statistics ||
              !Array.isArray(
                parsed.completedSessions
              )
            ) {
              throw new Error(
                "This is not a valid DBD backup."
              );
            }

            const defaults =
              createEmptyData();

            DATA = {
              ...defaults,
              ...parsed,

              appVersion:
                APP_VERSION,

              profile:
                defaults.profile,

              setup: {
                ...defaults.setup,
                ...(
                  parsed.setup ||
                  {}
                )
              },

              statistics: {
                ...defaults.statistics,
                ...parsed.statistics
              },

              settings: {
                ...defaults.settings,
                ...(
                  parsed.settings ||
                  {}
                ),

                chatRoutes: {
                  ...defaults
                    .settings
                    .chatRoutes,

                  ...(
                    parsed.settings
                      ?.chatRoutes ||
                    {}
                  )
                }
              }
            };

            saveData();

            alert(
              "DBD backup imported."
            );

            route(
              "home"
            );
          } catch (error) {
            alert(
              error.message ||
              "The backup could not be imported."
            );
          }
        };

      input.click();
    }

    function resetData() {
      const confirmed =
        confirm(
          "Delete all DBD progress and saved chat routes from this browser?"
        );

      if (!confirmed) {
        return;
      }

      DATA =
        createEmptyData();

      saveData();

      route(
        "home"
      );
    }

    function renderData() {
      return `
        <section class="panel">
          <div class="eyebrow">
            Local persistence
          </div>

          <h1 style="font-size: 2rem">
            DBD remembers this browser.
          </h1>

          <div class="message">
            <strong>
              Storage key:
            </strong>

            dbd_gazali

            <br><br>

            <span class="muted">
              Updating the code on the same GitHub
              Pages origin normally keeps this data.

              Another browser or device needs a backup
              import until cloud sync is added later.
            </span>
          </div>

          <div class="actions">
            <button
              class="button primary"

              onclick="
                requestPersistentStorage()
              "
            >
              REQUEST PERSISTENT STORAGE
            </button>

            <button
              class="button"

              onclick="
                exportBackup()
              "
            >
              EXPORT BACKUP
            </button>

            <button
              class="button"

              onclick="
                importBackup()
              "
            >
              IMPORT BACKUP
            </button>

            <button
              class="button danger"

              onclick="
                resetData()
              "
            >
              RESET DATA
            </button>
          </div>
        </section>

        <section class="panel">
          <div class="eyebrow">
            Router
          </div>

          <h2>
            Saved subject-chat links
          </h2>

          <p class="muted">
            These are bookmarks only.

            DBD does not read the chat or send
            messages automatically.
          </p>

          <div class="route-grid">
            ${SUBJECTS.map(
              subject => `
                <div class="route-card">
                  <strong>
                    ${escapeHTML(
                      subject.name
                    )}
                  </strong>

                  <input
                    id="route-${subject.id}"

                    value="${escapeHTML(
                      DATA
                        .settings
                        .chatRoutes[
                          subject.id
                        ] || ""
                    )}"

                    placeholder="https://chatgpt.com/c/..."
                  >
                </div>
              `
            ).join("")}
          </div>

          <div class="actions">
            <button
              class="button primary"

              onclick="
                saveChatRoutes()
              "
            >
              SAVE CHAT ROUTES
            </button>
          </div>
        </section>
      `;
    }

    async function copyText(
      text,
      button
    ) {
      try {
        await navigator
          .clipboard
          .writeText(
            text
          );
      } catch (error) {
        const textarea =
          document.createElement(
            "textarea"
          );

        textarea.value =
          text;

        document.body.appendChild(
          textarea
        );

        textarea.select();

        document.execCommand(
          "copy"
        );

        textarea.remove();
      }

      const original =
        button.textContent;

      button.textContent =
        "COPIED ✓";

      setTimeout(
        () => {
          button.textContent =
            original;
        },

        1300
      );
    }

    function render() {
      renderNavigation();

      const views = {
        home:
          renderHome,

        prompt:
          renderPrompt,

        import:
          renderImport,

        drill:
          renderDrill,

        summary:
          renderSummary,

        history:
          renderHistory,

        data:
          renderData
      };

      document.getElementById(
        "application"
      ).innerHTML =
        (
          views[currentView] ||
          renderHome
        )();

      if (
        currentView ===
        "drill"
      ) {
        startTimer();
      }
    }

    render();
  </script>
</body>
</html>
