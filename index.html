<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASAT Quiz Frontend v2</title>
<style>
:root{--bg:#071120;--card:#101b2d;--card2:#0b1525;--text:#eef6ff;--muted:#94a3b8;--line:#26354f;--green:#5ee0a0;--red:#fb7185;--yellow:#facc15}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#172554 0,#071120 38%,#030712 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}.wrap{max-width:1100px;margin:auto;padding:16px}.hero,.card{background:rgba(16,27,45,.94);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 18px 50px #0008}.hero{margin-bottom:14px}.hero h1{margin:0;font-size:clamp(30px,6vw,54px);letter-spacing:-.04em}.hero p,.muted{color:var(--muted)}.grid{display:grid;gap:14px}.two{grid-template-columns:1fr 1fr}.topgrid{grid-template-columns:1fr 130px}label{display:grid;gap:7px;color:var(--muted);font-size:13px;font-weight:800}select,input,textarea{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:16px;padding:12px;outline:none}textarea{min-height:300px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn{border:0;border-radius:16px;padding:12px 14px;min-height:45px;background:var(--green);color:#04130c;font-weight:950;cursor:pointer}.btn:hover{filter:brightness(1.08)}.btn.secondary{background:#1d2a42;color:var(--text);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.hidden{display:none!important}.pill{display:inline-flex;padding:6px 10px;border-radius:999px;background:#0d1b30;border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:900}.question{font-size:clamp(22px,4vw,34px);font-weight:950;margin:14px 0}.options{display:grid;gap:10px}.option{width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:18px;padding:15px;font-weight:750;cursor:pointer}.option:hover{background:#111f35}.option.correct{background:var(--green);color:#03150d;border-color:var(--green)}.option.wrong{background:var(--red);color:#300710;border-color:var(--red)}.feedback,.explain{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px}.explainGrid{display:grid;gap:10px;margin-top:12px}.explain.correct{border-color:#5ee0a0;background:#5ee0a022}.explain.selectedWrong{border-color:#fb7185;background:#fb718522}.meter{height:10px;border-radius:999px;overflow:hidden;background:#071120;border:1px solid var(--line);margin-top:10px}.meter div{height:100%;background:var(--green);width:0%;transition:.2s}.nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.dot{width:34px;height:34px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--muted);font-weight:850;cursor:pointer}.dot.current{border-color:var(--green);color:var(--green)}.dot.answered{background:#172a46;color:var(--text)}.dot.wrongMark{background:#fb718544;border-color:#fb7185}.score{font-size:56px;font-weight:1000;letter-spacing:-.06em}.topic{display:flex;justify-content:space-between;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--green);color:#04130c;padding:10px 14px;border-radius:999px;font-weight:950;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:820px){.two,.topgrid{grid-template-columns:1fr}.wrap{padding:12px}textarea{min-height:230px}.score{font-size:44px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero"><div class="row"><div><h1>ASAT Quiz Frontend</h1><p>NotebookLM makes the quiz. Paste JSON here. This app runs A–E questions offline, checks answers, explains every option, then gives a growth prompt.</p></div><span class="pill">offline html</span></div></header>
<section id="setup" class="grid">
<div class="card"><div class="grid topgrid"><label>Subject<select id="subject"></select></label><label>Questions<input id="count" type="number" min="3" max="100" value="50"></label></div><p id="meta" class="muted"></p></div>
<div class="grid two">
<div class="card"><div class="row"><h2>1. Copy this to NotebookLM</h2><button class="btn" id="copyPrompt">Copy</button></div><textarea id="prompt" readonly></textarea></div>
<div class="card"><div class="row"><h2>2. Paste NotebookLM JSON here</h2><button class="btn ghost" id="clear">Clear</button></div><textarea id="json" placeholder="Paste NotebookLM JSON quiz here..."></textarea><p id="err" style="color:var(--red)"></p><button class="btn" id="load">Load Quiz</button></div>
</div>
</section>
<section id="quiz" class="card hidden"><div class="row"><div><span id="qmeta" class="pill"></span><div class="meter"><div id="bar"></div></div></div><div><button class="btn secondary" id="finish">Finish</button> <button class="btn ghost" id="reset">Reset</button></div></div><div id="qtext" class="question"></div><div id="opts" class="options"></div><div id="fb" class="feedback hidden"></div><div style="margin-top:14px"><button class="btn secondary" id="prev">Prev</button> <button class="btn" id="next">Next</button></div><div id="nav" class="nav"></div></section>
<section id="results" class="grid hidden"><div class="card row"><div><div id="score" class="score">0/0</div><p id="percent" class="muted"></p></div><div><button class="btn secondary" id="wrongOnly">Review wrong</button> <button class="btn ghost" id="newQuiz">New quiz</button></div></div><div class="grid two"><div class="card"><h2>Weak topics</h2><div id="weak"></div></div><div class="card"><div class="row"><h2>3. Copy this back to NotebookLM</h2><button class="btn" id="copyGrowth">Copy</button></div><textarea id="growth" readonly></textarea></div></div></section>
</div><div id="toast" class="toast">Copied</div>
<script>
const SUBJECTS=[
{id:'sejarah',name:'Sejarah Indonesia',emoji:'🕌',exam:'3 Jun',count:50,material:'Kebudayaan Islam di Nusantara: masuknya Islam, akulturasi budaya, teori masuknya Islam, kerajaan Samudera Pasai, Aceh, Gowa-Tallo, Demak, Banten, Cirebon, dan Mataram Islam.',extra:'Prioritize chronology, theory comparison, kingdom characteristics, cause-effect, and cultural acculturation. Avoid trivial date memorization unless the source emphasizes it.'},
{id:'quran',name:'Pendidikan Qur’an',emoji:'📖',exam:'3 Jun',count:30,material:'Hafalan QS. Nuh dan Bab 8–10.',extra:'Use recall-check style questions, meaning questions, sequence/memorization checks, and concept checks. Include questions that test common hafalan mistakes.'},
{id:'informatika',name:'Informatika',emoji:'💻',exam:'4 Jun',count:35,material:'Etika dan Budaya Digital Indonesia, Keamanan Digital.',extra:'Use scenario questions about ethics, privacy, security, passwords, data protection, misinformation, and responsible digital behavior.'},
{id:'ppkn',name:'Pendidikan Pancasila',emoji:'🇮🇩',exam:'5 Jun',count:40,material:'Peran, hak, kewajiban warga negara sesuai kisi-kisi.',extra:'Make application questions about rights, obligations, and civic roles. Include confusing pairs like hak vs kewajiban.'},
{id:'arabic',name:'Bahasa Arab',emoji:'✍️',exam:'8 Jun',count:20,material:'Bab 7 dan 8 buku MKBM dan Digital.',extra:'Mix vocabulary, qawaid, qiraah comprehension, and sentence meaning. Keep Arabic text clear and source-aligned.'},
{id:'biology',name:'Biologi',emoji:'🍄',exam:'8 Jun',count:35,material:'Fungi dan Ekosistem.',extra:'Ask concept/process questions. For fungi, emphasize characteristics, classification, reproduction, and roles. For ecosystems, emphasize food chains, interactions, energy flow, and cycles.'},
{id:'geography',name:'Geografi',emoji:'🌍',exam:'8 Jun',count:35,material:'Bab Litosfer, Bab Atmosfer, Bab Hidrosfer.',extra:'Make concept and application questions. Include processes, layers, phenomena, causes, impacts, and examples where sources support them.'},
{id:'pai',name:'Pendidikan Agama Islam',emoji:'🕌',exam:'9 Jun',count:35,material:'Adab berpakaian, bepergian, bertamu, dan tokoh ulama di Indonesia/Wali Songo.',extra:'Mix definition, example, adab application, and Wali Songo identification/contribution questions.'},
{id:'economy',name:'Ekonomi',emoji:'🏦',exam:'9 Jun',count:35,material:'Sistem dan alat pembayaran, OJK, Bank, LKBB.',extra:'Emphasize concepts, functions, institutions, differences between bank/LKBB/OJK, payment systems, and real-life financial scenarios.'},
{id:'english',name:'Bahasa Inggris',emoji:'📝',exam:'10 Jun',count:30,material:'Future continuous, future perfect, gerund/infinitive, I wish/If only + Past Perfect, expository and narrative text.',extra:'Make grammar trap questions and reading comprehension questions. Include distractors that test tense, verb pattern, and meaning.'},
{id:'math',name:'Matematika',emoji:'📊',exam:'10 Jun',count:8,material:'Persamaan Kuadrat, Fungsi Kuadrat, Perbandingan Trigonometri, Statistika.',extra:'This is pen-paper. Make fewer questions. Require step-by-step reasoning. For each option, explain the likely mistake behind wrong answers.'},
{id:'indo',name:'Bahasa Indonesia',emoji:'📖',exam:'11 Jun',count:30,material:'Negosiasi, Biografi, Puisi: ciri-ciri, struktur, fitur kebahasaan.',extra:'Make text-analysis questions. Test structure, features, meaning, purpose, and language markers. Include plausible distractors.'},
{id:'chemistry',name:'Kimia',emoji:'🧪',exam:'11 Jun',count:8,material:'Tatanama senyawa, persamaan reaksi, stoikiometri.',extra:'This is pen-paper. Require balanced reactions, units, mole ratios, and naming logic. Explain the calculation/concept trap behind every wrong option.'},
{id:'sociology',name:'Sosiologi',emoji:'🧠',exam:'12 Jun',count:45,material:'Lembaga sosial, nilai norma sosial, sosialisasi, perilaku menyimpang, pengendalian sosial, rancangan penelitian sosial, pengumpulan data, pengolahan data, penulisan laporan penelitian sosial.',extra:'Prioritize concept-to-example questions, research method questions, and distinctions between similar terms.'},
{id:'physics',name:'Fisika',emoji:'⚡',exam:'12 Jun',count:8,material:'Pemanasan Global dan Energi Terbarukan.',extra:'Mix concept and pen-paper reasoning. Include cause-effect, energy source comparison, and formula/unit questions if present in the source.'}
];
let state={subject:SUBJECTS[0],questions:[],current:0,answers:{}};const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(m='Copied'){$('toast').textContent=m;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1000)}
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch{let x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}toast()}
function subj(){return SUBJECTS.find(s=>s.id===$('subject').value)||SUBJECTS[0]}
function buildPrompt(s,c){return `Create an ASAT quiz from ONLY the uploaded sources in this NotebookLM notebook.

Subject: ${s.name}
Exam date: ${s.exam}
Material focus: ${s.material}
Subject-specific instruction: ${s.extra}

Return ONLY valid JSON. No markdown. No extra text.

JSON format:
[
  {
    "question": "...",
    "options": [
      { "text": "A option", "explanation": "Explain why A is correct or incorrect." },
      { "text": "B option", "explanation": "Explain why B is correct or incorrect." },
      { "text": "C option", "explanation": "Explain why C is correct or incorrect." },
      { "text": "D option", "explanation": "Explain why D is correct or incorrect." },
      { "text": "E option", "explanation": "Explain why E is correct or incorrect." }
    ],
    "answerIndex": 0,
    "topic": "specific topic label",
    "overallExplanation": "Briefly explain the correct logic in 2-4 sentences."
  }
]

Rules:
1. Make exactly ${c} questions.
2. Every question must have exactly 5 choices: A, B, C, D, E.
3. Use exam-style questions, not lazy trivia.
4. Label every question with a specific topic.
5. Put the correct answer as answerIndex, using 0 for A, 1 for B, 2 for C, 3 for D, 4 for E.
6. For every option, explain why that option is correct or incorrect.
7. Wrong-option explanations must identify the misconception, trap, or reason the option fails.
8. Correct-option explanations must explain why it is the best answer.
9. Keep it concise but not shallow.
10. Use Indonesian unless the subject itself is English or Arabic.`}
function updatePrompt(){let s=subj();state.subject=s;$('count').value=$('count').value||s.count;$('meta').textContent=`${s.emoji} ${s.name} • Exam: ${s.exam} • ${s.material}`;$('prompt').value=buildPrompt(s,$('count').value||s.count)}
function cleanJson(t){t=t.trim().replace(/^```json\s*/i,'').replace(/^```\s*/i,'').replace(/```$/i,'').trim();let a=t.indexOf('['),b=t.lastIndexOf(']');if(a!==-1&&b!==-1&&b>a)t=t.slice(a,b+1);return t}
function normOpts(options,exps=[]){if(!Array.isArray(options))return[];return options.map((o,i)=>typeof o==='object'&&o?{text:o.text??o.option??o.answer??String(o),explanation:o.explanation??o.reason??exps[i]??'No explanation for this option.'}:{text:String(o),explanation:exps[i]??'No explanation for this option.'})}
function norm(raw){let arr=Array.isArray(raw)?raw:raw.questions;if(!Array.isArray(arr))throw Error('Quiz must be a JSON array or an object with a questions array.');return arr.map((q,i)=>{let ai=q.answerIndex;if(ai===undefined&&q.answer!==undefined)ai=q.answer;if(typeof ai==='string'){ai={A:0,B:1,C:2,D:3,E:4,a:0,b:1,c:2,d:3,e:4}[ai]??Number(ai)}let options=normOpts(q.options||[],q.optionExplanations||q.explanations||[]);return{id:q.id||i+1,question:q.question||q.q||`Question ${i+1}`,options,answerIndex:Number.isInteger(ai)?ai:Number(ai||0),topic:q.topic||'unknown',overallExplanation:q.overallExplanation||q.explanation||q.explain||'No overall explanation given.'}}).filter(q=>q.question&&q.options.length>=2)}
function load(){try{$('err').textContent='';let qs=norm(JSON.parse(cleanJson($('json').value)));if(!qs.length)throw Error('No valid questions found.');state.questions=qs;state.current=0;state.answers={};$('setup').classList.add('hidden');$('results').classList.add('hidden');$('quiz').classList.remove('hidden');render()}catch(e){$('err').textContent=e.message||'Could not parse quiz. Ask NotebookLM for valid JSON only.'}}
function answer(i){let q=state.questions[state.current];state.answers[q.id]={number:state.current+1,question:q.question,selectedIndex:i,selected:q.options[i]?.text,correctIndex:q.answerIndex,correctAnswer:q.options[q.answerIndex]?.text,correct:i===q.answerIndex,topic:q.topic,overallExplanation:q.overallExplanation,options:q.options};render()}
function render(){let q=state.questions[state.current],a=state.answers[q.id],total=state.questions.length,done=Object.keys(state.answers).length;$('qmeta').textContent=`${state.subject.emoji} ${state.subject.name} • ${state.current+1}/${total} • ${q.topic}`;$('bar').style.width=Math.round(done/total*100)+'%';$('qtext').textContent=q.question;$('opts').innerHTML='';q.options.forEach((o,i)=>{let b=document.createElement('button');b.className='option';b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${esc(o.text)}`;if(a){if(i===q.answerIndex)b.classList.add('correct');if(i===a.selectedIndex&&i!==q.answerIndex)b.classList.add('wrong')}b.onclick=()=>{if(!a)answer(i)};$('opts').appendChild(b)});if(a){$('fb').classList.remove('hidden');$('fb').innerHTML=feedback(q,a)}else{$('fb').classList.add('hidden');$('fb').innerHTML=''}nav()}
function feedback(q,a){let rows=q.options.map((o,i)=>{let cls='explain '+(i===q.answerIndex?'correct ':'')+(i===a.selectedIndex&&i!==q.answerIndex?'selectedWrong':'');let tag=i===q.answerIndex?'Correct answer':i===a.selectedIndex?'Your answer':'Wrong option';return `<div class="${cls}"><b>${String.fromCharCode(65+i)}. ${esc(o.text)}</b> <span class="muted">• ${tag}</span><div class="muted">${esc(o.explanation)}</div></div>`}).join('');return `<b>${a.correct?'Correct.':'Wrong. Good, now we found the leak.'}</b><p class="muted">You chose ${String.fromCharCode(65+a.selectedIndex)}. Correct answer: ${String.fromCharCode(65+q.answerIndex)}.</p><p>${esc(q.overallExplanation)}</p><div class="explainGrid">${rows}</div>`}
function nav(){$('nav').innerHTML='';state.questions.forEach((q,i)=>{let b=document.createElement('button');b.className='dot';b.textContent=i+1;if(i===state.current)b.classList.add('current');if(state.answers[q.id])b.classList.add('answered');if(state.answers[q.id]&&!state.answers[q.id].correct)b.classList.add('wrongMark');b.onclick=()=>{state.current=i;render()};$('nav').appendChild(b)})}
function next(){state.current+1>=state.questions.length?results():(state.current++,render())}function prev(){if(state.current>0){state.current--;render()}}
function allAns(){return state.questions.map(q=>state.answers[q.id]).filter(Boolean)}
function results(){let ans=allAns(),score=ans.filter(a=>a.correct).length,total=state.questions.length,wrong=ans.filter(a=>!a.correct);$('quiz').classList.add('hidden');$('results').classList.remove('hidden');$('score').textContent=`${score}/${total}`;$('percent').textContent=`${Math.round(score/Math.max(total,1)*100)}% score • ${wrong.length} wrong`;let map={};wrong.forEach(w=>map[w.topic]=(map[w.topic]||0)+1);let topics=Object.entries(map).sort((a,b)=>b[1]-a[1]);$('weak').innerHTML=topics.length?topics.map(([t,n])=>`<div class="topic"><span>${esc(t)}</span><b>${n} wrong</b></div>`).join(''):`<p class="muted" style="color:var(--green)">No weak topics. suspiciously powerful behavior.</p>`;$('growth').value=growth(score,total,wrong)}
function growth(score,total,wrong){return `Analyze my ASAT quiz result using the uploaded sources in NotebookLM.

Subject: ${state.subject.name}
Material focus: ${state.subject.material}
Score: ${score}/${total}

Wrong answers:
${wrong.map(w=>`- Q${w.number} | Topic: ${w.topic} | Question: ${w.question} | My answer: ${w.selected} | Correct answer: ${w.correctAnswer}`).join('\n')||'None'}

Do this:
1. Identify my top weak topics.
2. Explain my mistake patterns.
3. Tell me what to review first.
4. Create a 20-question weak-area drill in the SAME JSON format as before.
5. Every new question must have 5 choices: A, B, C, D, E.
6. For every option, explain why it is correct or incorrect.
7. Keep it source-based and exam-style.
8. Return the new JSON quiz after the analysis section.`}
function reviewWrong(){let wrongQs=state.questions.filter(q=>state.answers[q.id]&&!state.answers[q.id].correct);if(!wrongQs.length)return;state.questions=wrongQs;state.current=0;state.answers={};$('results').classList.add('hidden');$('quiz').classList.remove('hidden');render()}
function resetSetup(){state.questions=[];state.current=0;state.answers={};$('quiz').classList.add('hidden');$('results').classList.add('hidden');$('setup').classList.remove('hidden')}function resetQuiz(){state.current=0;state.answers={};render()}
function init(){SUBJECTS.forEach(s=>{let o=document.createElement('option');o.value=s.id;o.textContent=`${s.emoji} ${s.name} • ${s.exam}`;$('subject').appendChild(o)});$('subject').onchange=()=>{let s=subj();$('count').value=s.count;updatePrompt()};$('count').oninput=updatePrompt;$('copyPrompt').onclick=()=>copyText($('prompt').value);$('load').onclick=load;$('clear').onclick=()=>{$('json').value='';$('err').textContent=''};$('next').onclick=next;$('prev').onclick=prev;$('finish').onclick=results;$('reset').onclick=resetQuiz;$('newQuiz').onclick=resetSetup;$('wrongOnly').onclick=reviewWrong;$('copyGrowth').onclick=()=>copyText($('growth').value);updatePrompt()}init();
</script>
</body>
</html>
