<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4b400">
  <title>DBD v0.9.3 — Drill Baby Drill</title>
  <style>
    :root{

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.42;cursor:not-allowed}

    .brand{display:flex;align-items:baseline;gap:10px}.brand strong{font-size:1.8rem;letter-spacing:.06em;color:var(--yellow)}.brand span{font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
    nav{display:flex;gap:6px}nav button{padding:8px 12px;color:var(--muted);background:#171a1d;border:1px solid var(--line);border-radius:8px;font-size:.7rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}nav button.active{background:var(--yellow);border-color:var(--yellow);color:#181300}
    main{max-width:980px;margin:auto;padding:24px 18px calc(88px + var(--safe-bottom))}
    h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.03;margin-bottom:9px}h2{font-size:1.3rem;margin-bottom:7px}h3{font-size:1rem;margin-bottom:6px}
    .muted{color:var(--muted)}.eyebrow{margin-bottom:7px;color:var(--yellow);font-size:.68rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase}
    .panel{margin-bottom:16px;padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}.hero{padding:28px 22px}.hero p{max-width:760px}
    .setup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}.field{margin-bottom:15px}label{display:block;margin-bottom:7px;color:var(--muted);font-size:.7rem;font-weight:850;letter-spacing:.09em;text-transform:uppercase}
    select,input,textarea{width:100%;padding:11px 12px;color:var(--text);background:var(--inset);border:1px solid var(--line);border-radius:9px;outline:none}select:focus,input:focus,textarea:focus{border-color:var(--yellow)}textarea{min-height:102px;resize:vertical}.code-input{min-height:225px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.8rem}
    .choice-row,.count-row,.actions{display:flex;flex-wrap:wrap;gap:8px}.count-row{align-items:center}.count-row input{width:92px}.actions{margin-top:18px}.actions.primary-grid{display:grid;grid-template-columns:1.5fr 1fr}
    .button{padding:12px 15px;color:var(--text);background:#15181b;border:1px solid var(--line);border-radius:9px;font-weight:850}.button:hover{border-color:#6d7379}.button.primary{color:#181300;background:var(--yellow);border-color:var(--yellow)}.button.small{padding:8px 10px;font-size:.76rem}.button.tiny{padding:6px 9px;font-size:.69rem}.button.block{width:100%}.button.danger{color:#ff9b98;border-color:var(--red)}.button.ghost{background:transparent}
    .chip{padding:9px 12px;color:var(--muted);background:#121518;border:1px solid var(--line);border-radius:999px;font-size:.76rem;font-weight:800}.chip.active{color:#181300;background:var(--yellow);border-color:var(--yellow)}
    .type-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.type-card{padding:13px;text-align:left;background:#121518;border:1px solid var(--line);border-radius:11px;color:var(--text)}.type-card strong{display:block;font-size:.88rem}.type-card span{display:block;margin-top:5px;color:var(--muted);font-size:.72rem;line-height:1.35}.type-card.active{border-color:var(--yellow);box-shadow:0 0 0 1px var(--yellow) inset}.type-card.active strong{color:var(--yellow)}
    .note{color:var(--muted);font-size:.78rem;margin-top:7px}.large-note{padding:12px 13px;background:rgba(112,167,255,.08);border:1px solid rgba(112,167,255,.45);border-radius:9px;color:#cfe0ff;margin-top:12px}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}.stat{padding:14px;background:var(--inset);border:1px solid var(--line);border-radius:10px}.stat strong{display:block;color:var(--yellow);font-size:1.45rem}.stat span{color:var(--muted);font-size:.67rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
    .code{max-height:560px;overflow:auto;padding:15px;color:#e3ded2;background:#0d0f11;border:1px solid var(--line);border-radius:9px;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.78rem}
    .message{padding:12px 13px;margin-bottom:14px;background:var(--inset);border:1px solid var(--line);border-radius:9px}.message.error{color:#ffb4b2;border-color:var(--red)}.message.success{color:#c3f1c5;border-color:var(--green)}.message.info{border-color:var(--yellow-dark)}
    .dropzone{padding:28px 16px;text-align:center;border:1px dashed #666;background:#111416;border-radius:11px}.dropzone.drag{border-color:var(--yellow);background:rgba(244,180,0,.06)}.file-meta{margin-top:10px;color:var(--muted);font-size:.8rem}
    details.import-paste{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:#131619}details.import-paste summary{padding:13px;cursor:pointer;font-weight:800}details.import-paste>div{padding:0 13px 13px}
    .daily-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.daily-card{padding:14px;background:#111416;border:1px solid var(--line);border-radius:11px}.daily-card.done{border-color:var(--green)}.daily-card strong{display:block}.daily-card .status{margin-top:7px;font-size:.75rem;color:var(--muted)}.daily-card.done .status{color:var(--green)}
    .session{margin-bottom:9px;padding:13px;background:var(--inset);border:1px solid var(--line);border-radius:10px}.session-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.session small{color:var(--muted)}.pill{display:inline-block;margin:3px 4px 3px 0;padding:4px 8px;color:var(--muted);border:1px solid var(--line);border-radius:999px;font-size:.68rem}
    .progress{height:7px;margin-bottom:15px;overflow:hidden;background:#0d0f11;border-radius:6px}.progress div{height:100%;background:var(--yellow)}
    .session-top,.question-meta{display:flex;align-items:center;justify-content:space-between;gap:10px}.question-meta{color:var(--muted);font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.timer{margin:12px 0;color:var(--yellow);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:1.35rem;font-weight:900;text-align:right}.question-limit{color:var(--muted);font-size:.72rem;text-align:right;margin-top:-9px;margin-bottom:10px}
    .question-text{margin:15px 0 20px;font-size:1.18rem;font-weight:750;line-height:1.48;white-space:pre-wrap}.choices{display:grid;gap:9px}.answer-choice{width:100%;padding:14px;color:var(--text);background:#111416;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:9px;text-align:left}.answer-choice.selected{border-left-color:var(--yellow);background:rgba(244,180,0,.06)}.answer-choice.correct{background:rgba(104,198,107,.08);border-left-color:var(--green)}.answer-choice.wrong{background:rgba(239,83,80,.08);border-left-color:var(--red)}
    .confidence-wrap{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06)}.confidence-label{font-size:.65rem;color:var(--muted);font-weight:850;letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px}.confidence-row{display:flex;gap:6px;flex-wrap:wrap}.confidence-btn{padding:6px 9px;background:#101315;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:.68rem;font-weight:800}.confidence-btn.active{background:#29220c;border-color:var(--yellow);color:var(--yellow)}
    .honesty-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.honesty-row button{padding:10px;font-size:.76rem}.flag-btn.active{border-color:var(--orange);color:var(--orange)}
    .stimulus{margin:16px 0;padding:16px;background:#111416;border:1px solid var(--line);border-radius:11px;white-space:pre-wrap;line-height:1.65}.stimulus.quote{position:relative;padding:24px 18px 18px 48px;font-size:1.02rem}.stimulus.quote:before{content:'“';position:absolute;left:14px;top:2px;color:var(--yellow);font-family:Georgia,serif;font-size:4rem;line-height:1}.stimulus-title{font-weight:900;margin-bottom:9px}.stimulus-source{margin-top:10px;color:var(--muted);font-size:.78rem;text-align:right}
    .feedback{margin-top:16px;padding:14px;background:#111416;border:1px solid var(--line);border-radius:9px}.feedback.correct{border-color:var(--green)}.feedback.wrong{border-color:var(--red)}.feedback-tag{display:inline-block;margin-bottom:8px;padding:4px 8px;border-radius:5px;font-size:.68rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase}.feedback.correct .feedback-tag{color:var(--green);background:rgba(104,198,107,.14)}.feedback.wrong .feedback-tag{color:#ff8b88;background:rgba(239,83,80,.14)}
    .error-types{display:flex;flex-wrap:wrap;gap:7px}.error-type{padding:7px 10px;color:var(--muted);background:#111416;border:1px solid var(--line);border-radius:999px;font-size:.7rem}.error-type.active{color:#181300;background:var(--yellow);border-color:var(--yellow);font-weight:900}
    .question-footer{position:sticky;bottom:calc(7px + var(--safe-bottom));z-index:25;margin-top:16px;padding:8px;background:rgba(16,18,20,.92);border:1px solid rgba(255,255,255,.06);border-radius:13px;backdrop-filter:blur(10px)}.question-footer-grid{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}.question-footer .button{padding:11px 12px}
    .navigator-button{min-width:110px;text-align:center}.navigator-overlay,.pause-overlay,.preflight-backdrop{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:18px;background:rgba(5,7,8,.58);backdrop-filter:blur(15px)}.navigator-card,.pause-card,.preflight-card{width:min(540px,100%);max-height:90vh;overflow:auto;padding:22px;background:linear-gradient(180deg,#202428,#171a1d);border:1px solid #4a5056;border-radius:18px;box-shadow:0 35px 110px rgba(0,0,0,.72)}
    .navigator-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:15px}.nav-q{aspect-ratio:1;display:grid;place-items:center;border-radius:9px;background:#101315;border:1px solid var(--line);color:var(--muted);font-weight:900}.nav-q.current{border-color:var(--yellow);color:var(--yellow)}.nav-q.answered{border-color:var(--green);color:var(--green)}.nav-q.unsure{border-color:var(--blue);color:var(--blue)}.nav-q.guess{border-color:var(--orange);color:var(--orange)}.nav-q.skipped{border-style:dashed}.nav-q.flagged:after{content:'•';position:absolute;color:var(--orange);transform:translate(13px,-13px)}.nav-q{position:relative}
    .preflight-card:before{content:'';display:block;height:6px;margin:-22px -22px 20px;background:repeating-linear-gradient(135deg,var(--yellow) 0 12px,#111 12px 24px);border-radius:18px 18px 0 0}.preflight-title{text-align:center}.preflight-title h1{font-size:2.25rem}.preflight-kicker{text-align:center;color:var(--yellow);font-weight:900;letter-spacing:.18em;font-size:.69rem;text-transform:uppercase}.manifest{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:17px 0}.manifest-item{padding:10px;background:#101315;border:1px solid var(--line);border-radius:9px}.manifest-item span{display:block;color:var(--muted);font-size:.67rem;text-transform:uppercase;letter-spacing:.08em}.manifest-item strong{display:block;margin-top:3px}.check-list{padding:0;margin:12px 0;list-style:none}.check-list li{margin:7px 0;padding-left:24px;position:relative}.check-list li:before{position:absolute;left:0;font-weight:900}.check-list.error li:before{content:'×';color:var(--red)}.check-list.warning li:before{content:'!';color:var(--yellow)}.check-list.ok li:before{content:'✓';color:var(--green)}
    .review-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.review-stat{padding:12px;background:#101315;border:1px solid var(--line);border-radius:9px;text-align:center}.review-stat strong{display:block;font-size:1.35rem;color:var(--yellow)}.review-stat span{font-size:.65rem;color:var(--muted);text-transform:uppercase}
    .report-tabs,.quiz-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.report-tabs .active{border-color:var(--yellow);color:var(--yellow)}.quiz-card{margin:10px 0;background:#111416;border:1px solid var(--line);border-radius:11px;overflow:hidden}.quiz-card summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px;cursor:pointer;font-weight:850}.quiz-body{padding:0 13px 15px}.result-badge{padding:4px 7px;border-radius:999px;font-size:.65rem}.result-badge.correct{color:var(--green);border:1px solid var(--green)}.result-badge.wrong{color:#ff8f8c;border:1px solid var(--red)}.result-badge.unanswered{color:var(--muted);border:1px solid var(--line)}.choice-review{padding:8px 10px;margin:5px 0;background:#0f1214;border-left:3px solid var(--line);border-radius:6px}.choice-review.correct-choice{border-left-color:var(--green)}.choice-review.user-wrong{border-left-color:var(--red)}.quiz-answer{padding:10px;margin:10px 0;background:#0f1214;border-radius:8px}.quiz-answer.good{border:1px solid var(--green)}.quiz-answer.bad{border:1px solid var(--red)}
    .empty{padding:28px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;text-align:center}.footer{padding:22px 10px 5px;color:var(--muted);font-size:.7rem;text-align:center}

    /* v0.9.2 mobile-first refinements */
    details.customization{margin-top:16px;border:1px solid var(--line);border-radius:12px;background:#131619;overflow:hidden}
    details.customization>summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 15px;cursor:pointer;font-size:.78rem;font-weight:900;letter-spacing:.09em;text-transform:uppercase;list-style:none}
    details.customization>summary::-webkit-details-marker{display:none}
    details.customization>summary:after{content:'＋';color:var(--yellow);font-size:1.1rem}
    details.customization[open]>summary:after{content:'−'}
    .customization-body{padding:2px 15px 15px;border-top:1px solid var(--line)}
    .home-action-grid{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:9px;margin-top:18px}
    .pending-session{border-color:var(--yellow-dark);background:linear-gradient(135deg,rgba(244,180,0,.08),var(--inset))}
    .pending-badge{display:inline-block;margin-bottom:7px;padding:4px 8px;border-radius:999px;background:rgba(244,180,0,.12);color:var(--yellow);font-size:.65rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
    .session-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}
    .preflight-backdrop{padding:12px;background:rgba(5,7,8,.66);backdrop-filter:blur(18px)}
    .preflight-card{width:min(620px,100%);max-height:calc(100dvh - 24px);padding:20px;border-radius:20px}
    .preflight-card:before{margin:-20px -20px 18px;border-radius:20px 20px 0 0}
    .preflight-title h1{font-size:clamp(2rem,10vw,3rem);line-height:.98;margin-bottom:8px}
    .preflight-settings{margin:14px 0;border:1px solid var(--line);border-radius:12px;background:#111416;overflow:hidden}
    .preflight-settings>summary,.validation-details>summary{padding:13px 14px;cursor:pointer;font-weight:900;list-style:none}
    .preflight-settings>summary::-webkit-details-marker,.validation-details>summary::-webkit-details-marker{display:none}
    .preflight-settings>summary:after,.validation-details>summary:after{content:'＋';float:right;color:var(--yellow)}
    .preflight-settings[open]>summary:after,.validation-details[open]>summary:after{content:'−'}
    .preflight-settings-body{padding:0 14px 14px;border-top:1px solid var(--line)}
    .preflight-settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:13px}
    .preflight-settings .field{margin:0}
    .preflight-settings textarea{min-height:74px}
    .validation-details{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:#111416;overflow:hidden}
    .validation-details>div{padding:0 14px 12px;border-top:1px solid var(--line)}
    .preflight-actions{display:grid;gap:9px;margin-top:17px}
    .preflight-actions .button{width:100%;min-height:48px}
    .preflight-actions .primary{min-height:56px;font-size:1rem}
    .question-footer-grid{grid-template-columns:1fr}
    .question-footer .button{width:100%;min-height:48px}
    .session-top{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
    .session-top .navigator-button{width:100%;min-width:0}

    @media(max-width:760px){
      header{position:sticky}.topbar{padding:10px 12px;gap:8px;align-items:stretch;flex-direction:column}.brand{width:100%;align-items:center;gap:8px}.brand strong{font-size:1.55rem}.brand span{font-size:.56rem;line-height:1.15;letter-spacing:.11em}nav{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}nav button{padding:9px 6px;font-size:.64rem}main{padding:14px 10px calc(84px + var(--safe-bottom))}.setup-grid,.actions.primary-grid,.stats,.home-action-grid{grid-template-columns:1fr}.type-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.session-head{flex-direction:column}.session-head .actions{margin-top:0}.review-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.manifest{grid-template-columns:1fr 1fr}.preflight-settings-grid{grid-template-columns:1fr 1fr}.session-top{grid-template-columns:1fr}.session-actions{justify-content:stretch}.session-actions .button{flex:1}.question-footer-grid{grid-template-columns:1fr}.panel{border-radius:12px}}

    @media(max-width:420px){
      main{padding-left:8px;padding-right:8px}.panel{padding:15px}.hero{padding:18px 15px}.type-grid{grid-template-columns:1fr}.type-card{padding:11px}.type-card span{font-size:.68rem}.confidence-row{gap:5px}.confidence-btn{font-size:.64rem;padding:5px 8px}.honesty-row{grid-template-columns:1fr 1fr}.navigator-grid{grid-template-columns:repeat(5,1fr)}.preflight-backdrop{padding:6px;align-items:center}.preflight-card{width:100%;max-height:calc(100dvh - 12px);padding:16px;border-radius:16px}.preflight-card:before{margin:-16px -16px 16px;border-radius:16px 16px 0 0}.manifest{grid-template-columns:1fr 1fr;gap:7px}.manifest-item{padding:9px}.preflight-settings-grid{grid-template-columns:1fr}.preflight-title h1{font-size:2.45rem}.home-action-grid{gap:8px}.session-actions{display:grid;grid-template-columns:repeat(3,1fr);width:100%}.session-actions .button{padding:8px 5px;font-size:.66rem}.question-text{font-size:1.12rem}.answer-choice{padding:13px}.brand span{max-width:210px}}


    /* v0.9.3 — focus-first visual pass */
    body{padding-top:7px}
    .hazard{position:fixed;top:0;left:0;right:0;z-index:200;height:7px;box-shadow:0 2px 12px rgba(0,0,0,.35)}
    header{top:7px}
    .brand-button{appearance:none;border:0;background:transparent;color:inherit;padding:0;margin:0;text-align:left;display:flex;align-items:baseline;gap:10px;cursor:pointer}
    .brand-button:hover strong{filter:brightness(1.08)}
    .launch-actions{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;margin-bottom:12px}
    .launch-actions .button{min-height:58px;font-size:.9rem}
    details.customization.custom-drill{margin-top:12px;border-color:rgba(112,167,255,.58);background:linear-gradient(145deg,rgba(112,167,255,.08),#131619 52%);box-shadow:inset 0 0 0 1px rgba(112,167,255,.05)}
    details.customization.custom-drill>summary:after{color:var(--blue)}
    details.customization.custom-drill>summary strong{color:#dbe8ff}
    .custom-generate{margin-top:16px;width:100%;min-height:54px}
    .home-clean{padding-top:22px}
    .home-clean h1{margin-bottom:18px}
    .activity-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
    .activity-mini{padding:12px 14px;background:#111416;border:1px solid var(--line);border-radius:12px}
    .activity-mini strong{display:block;color:var(--text);font-size:1.3rem}.activity-mini span{color:var(--muted);font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800}
    body.drill-mode header nav{display:none!important}
    body.drill-mode .topbar{min-height:52px;padding-top:8px;padding-bottom:8px}
    body.drill-mode .brand span{display:none}
    body.drill-mode main{max-width:760px;padding-top:12px}
    .drill-shell{max-width:760px;margin:0 auto}
    .progress-shell{position:relative;height:30px;margin:0 0 12px;border:1px solid var(--line);background:#090b0d;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.45)}
    .progress-shell .progress-fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#f4b400,#ffd45d);transition:width .22s ease}
    .progress-shell .progress-label{position:absolute;inset:0;display:grid;place-items:center;color:#f6f2e8;font-size:.68rem;font-weight:950;letter-spacing:.1em;text-transform:uppercase;text-shadow:0 1px 3px #000}
    .question-panel{min-height:calc(100svh - 114px);display:flex;flex-direction:column;padding:24px;background:linear-gradient(160deg,#202529,#181c1f 58%,#15181b);box-shadow:0 22px 70px rgba(0,0,0,.25);border-color:#3b4248}
    .question-panel .question-core{flex:1;display:flex;flex-direction:column}

    .comment-box summary::-webkit-details-marker{display:none}.comment-box summary:after{content:'＋';float:right}.comment-box[open] summary:after{content:'−'}
    .comment-box .comment-body{padding:0 10px 10px}.comment-box textarea{min-height:70px;font-size:.84rem}
    .score-hero{display:grid;place-items:center;text-align:center;padding:28px 12px 24px;background:radial-gradient(circle at 50% 15%,rgba(244,180,0,.15),transparent 58%)}

    @media(max-width:420px){
      .topbar{padding:8px 10px}.brand strong{font-size:1.55rem}nav{grid-template-columns:repeat(2,minmax(78px,1fr))}nav button{font-size:.61rem;padding:8px 7px}main{padding-top:10px}.panel{padding:14px}.launch-actions .button{min-height:55px}.question-panel{padding:15px 11px 11px;border-radius:16px}.question-panel .question-text{font-size:1.18rem;min-height:4.6em}.question-panel .answer-choice{min-height:60px;padding:13px}.question-panel .feedback-slot,.question-panel .feedback{min-height:158px}.score-hero{padding:22px 8px}.result-actions{grid-template-columns:1fr}}

  </style>

<body>
  <div class="hazard"></div>
  <header><div class="topbar"><button class="brand brand-button" onclick="homeFromLogo()" aria-label="DBD home"><strong>DBD</strong><span>Drill Baby Drill · Gazali Edition</span></button><nav id="navigation"></nav></div></header>
  <main id="application"></main>
<script>
const APP_VERSION='0.9.3';
const STORAGE_KEY='dbd_gazali';
const LARGE_PACKET_THRESHOLD=15;
const SUBJECTS=[
  {id:'chemistry',campaign:'School',name:'Kimia'},
  {id:'physics',campaign:'School',name:'Fisika'},
  {id:'matwa',campaign:'School',name:'Matematika Wajib'},
  {id:'matlan',campaign:'School',name:'Matematika Tingkat Lanjut'},
  {id:'indonesian',campaign:'School',name:'Bahasa Indonesia'},
  {id:'sat-math',campaign:'SAT',name:'SAT Math'},
  {id:'sat-rw',campaign:'SAT',name:'SAT Reading & Writing'},
  {id:'osn-geography',campaign:'OSN Geografi',name:'OSN Geografi'},
  {id:'other-school',campaign:'School',name:'Other School Subject'},
  {id:'custom',campaign:'Custom',name:'Custom'}
];
const TEST_TYPES=[
  {id:'coverage',label:'Coverage Scan',description:'Broadly expose what you know, what is shaky, and what is missing.',defaults:{answerFormat:'mcq',workingStyle:'concept',difficulty:'Adaptive',feedback:'immediate',timing:'off'}},
  {id:'focused',label:'Focused Drill',description:'Repeat one narrow skill or procedure using varied questions.',defaults:{answerFormat:'mixed',workingStyle:'full',difficulty:'Medium',feedback:'immediate',timing:'record'}},
  {id:'deep',label:'Deep Practice',description:'Reason, calculate, interpret, and transfer—not just recognize.',defaults:{answerFormat:'mixed',workingStyle:'full',difficulty:'Difficult',feedback:'end',timing:'record'}},
  {id:'repair',label:'Repair Drill',description:'Test old weaknesses using fresh variants and precise feedback.',defaults:{answerFormat:'mixed',workingStyle:'concept',difficulty:'Adaptive',feedback:'immediate',timing:'off'}},
  {id:'mastery',label:'Mastery Check',description:'Perform independently after learning, without answer leakage.',defaults:{answerFormat:'mixed',workingStyle:'full',difficulty:'Adaptive',feedback:'end',timing:'record'}},
  {id:'exam',label:'Exam Simulation',description:'Perform under exam-like structure, pacing, and delayed results.',defaults:{answerFormat:'mixed',workingStyle:'full',difficulty:'Adaptive',feedback:'end',timing:'ai'}}
];
const WORKING_STYLES=[['concept','No pen or paper'],['full','Full problem solving']];
const ANSWER_FORMATS=[['mcq','Multiple choice only'],['mixed','Mixed']];
const DIFFICULTIES=['Easy','Medium','Difficult','Adaptive'];
const COUNT_PRESETS=[5,10,20];
const FEEDBACKS=[['immediate','Immediate'],['end','After session']];
const TIMINGS=[['off','Off'],['record','Record only'],['ai','AI-set limits']];
const CONFIDENCES=[['sure','Sure'],['unsure','Not sure'],['guess','Ngasal']];
const ERROR_TYPES=[['concept','Did not know'],['formula','Forgot rule/formula'],['method','Wrong method'],['execution','Execution/calculation'],['misread','Misread'],['careless','Careless/rushed'],['guess','Guessed'],['focus','Lost focus'],['timeout','Timed out'],['bad-question','Bad question'],['unclassified','Unclassified']];

function emptyData(){return{
  appVersion:APP_VERSION,
  profile:{name:'Gazali Darmawan',grade:'Grade 11',className:'Science 2'},
  setup:{subjectId:'matlan',testType:'coverage',workingStyle:'concept',answerFormat:'mcq',count:5,difficulty:'Adaptive',feedback:'immediate',timing:'off',showTimer:true,focus:''},
  statistics:{answered:0,correct:0,wrong:0},
  completedSessions:[],activeSessions:[],currentActiveId:null,pendingPacket:null,dailyState:{},
  settings:{persistentStorageGranted:false}
}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(v){return String(v??'').trim().toLowerCase().replace(/\s+/g,' ')}
function fmt(seconds){if(seconds===null||seconds===undefined||!Number.isFinite(Number(seconds)))return'—';const n=Math.max(0,Math.round(Number(seconds))),m=Math.floor(n/60),s=String(n%60).padStart(2,'0');return `${m}:${s}`}
function label(list,id){return list.find(x=>x[0]===id)?.[1]||id||'—'}
function testType(id){return TEST_TYPES.find(x=>x.id===id)||TEST_TYPES[0]}
function subject(id=DATA.setup.subjectId){return SUBJECTS.find(x=>x.id===id)||SUBJECTS[0]}
function errorLabel(id){return ERROR_TYPES.find(x=>x[0]===id)?.[1]||id||'—'}
function localDay(date=new Date()){const y=date.getFullYear(),m=String(date.getMonth()+1).padStart(2,'0'),d=String(date.getDate()).padStart(2,'0');return `${y}-${m}-${d}`}
function deriveLegacyTestType(s){if(s?.testType)return s.testType;if(s?.target==='mistakes')return'repair';if(s?.scope==='broad'&&s?.task==='check')return'coverage';if(s?.scope==='focused'&&s?.task==='apply')return'deep';if(s?.scope==='focused')return'focused';return'mastery'}
function migrateSetup(s){const d=emptyData().setup;if(!s)return{...d};const out={...d,...s};out.testType=deriveLegacyTestType(s);if(out.answerFormat==='typed')out.answerFormat='mixed';if(!['mcq','mixed'].includes(out.answerFormat))out.answerFormat='mixed';if(!out.workingStyle)out.workingStyle='full';if(![5,10,20].includes(Number(out.count)))out.count=Math.max(1,Math.min(100,Number(out.count)||5));return out}
function newResponse(){return{answer:null,draft:'',status:'unseen',confidence:'sure',flagged:false,elapsed:0,locked:false,revealed:false,correct:null,errorType:null,note:'',comment:'',timedOut:false}}
function migrateLegacyActive(a){if(!a)return null;const qs=a.packet?.questions||[],responses=qs.map(()=>newResponse());(a.attempts||[]).forEach((att,i)=>{if(!responses[i])return;responses[i]={...responses[i],answer:att.selected??null,status:att.timedOut?'timeout':'answered',confidence:'sure',elapsed:att.elapsed||0,locked:a.setupSnapshot?.feedback==='immediate',revealed:a.setupSnapshot?.feedback==='immediate',correct:!!att.correct,errorType:att.errorType||null,note:att.note||'',comment:att.comment||'',timedOut:!!att.timedOut}});const idx=Math.min(a.index||0,Math.max(0,qs.length-1));return{id:a.id||`legacy_${Date.now()}`,packet:a.packet,setupSnapshot:{...migrateSetup(a.setupSnapshot),feedback:a.setupSnapshot?.feedback||'immediate',timing:a.setupSnapshot?.timing||'off'},responses,currentIndex:idx,startedAt:a.startedAt||Date.now(),lastOpenedAt:Date.now(),liveStartedAt:null,paused:false,retryKind:a.retryKind||null}}
function loadData(){try{const d=emptyData(),s=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');let active=Array.isArray(s.activeSessions)?s.activeSessions:[];if(!active.length&&s.activeSession){const converted=migrateLegacyActive(s.activeSession);if(converted)active=[converted]}active=active.map(a=>({liveStartedAt:null,paused:false,...a,responses:(Array.isArray(a.responses)?a.responses:(a.packet?.questions||[]).map(()=>newResponse())).map(r=>({comment:'',...r}))}));return{...d,...s,appVersion:APP_VERSION,profile:d.profile,setup:migrateSetup(s.setup),statistics:{...d.statistics,...(s.statistics||{})},completedSessions:Array.isArray(s.completedSessions)?s.completedSessions:[],activeSessions:active,currentActiveId:active.some(a=>a.id===s.currentActiveId)?s.currentActiveId:(active[0]?.id||null),pendingPacket:s.pendingPacket||null,dailyState:s.dailyState||{},settings:{...d.settings,...(s.settings||{})}}}catch(e){console.error(e);return emptyData()}}
let DATA=loadData(),view='home',currentSessionId=null,importError='',timerInterval=null,navigatorOpen=false,customizationOpen=false;
function save(){DATA.appVersion=APP_VERSION;localStorage.setItem(STORAGE_KEY,JSON.stringify(DATA))}
function active(){return DATA.activeSessions.find(x=>x.id===DATA.currentActiveId)||null}
function route(v){accrueTime();stopTimer();view=v;navigatorOpen=false;if(v!=='home')customizationOpen=false;render();window.scrollTo({top:0,behavior:'smooth'})}

function homeFromLogo(){if(view==='drill')return;route('home')}
function renderNav(){const nav=document.getElementById('navigation');if(view==='drill'){nav.innerHTML='';return}const items=[['history','History'],['data','Data']];nav.innerHTML=items.map(([id,l])=>`<button class="${view===id?'active':''}" onclick="route('${id}')">${l}</button>`).join('')}
function updateSetup(k,v){if(k==='count')v=Math.max(1,Math.min(100,parseInt(v,10)||5));DATA.setup[k]=v;save();render()}
function selectTestType(id){const t=testType(id);DATA.setup={...DATA.setup,testType:id,...t.defaults};save();render()}
function testTypeInstruction(id){return{
  coverage:'Sample the selected material broadly. Spread questions across distinct concepts. Use concise questions that expose known, shaky, and unknown areas. Avoid repetitive drilling of one detail.',
  focused:'Stay on one narrow skill or procedure. Use varied examples and repeated execution without merely duplicating the same question.',
  deep:'Prioritize reasoning, calculations, interpretation, comparison, multi-step application, and transfer. Avoid shallow recall unless it is needed as a foundation.',
  repair:'Use previous DBD evidence and unresolved mistakes. Test the same weaknesses with fresh wording, values, cases, passages, or distractors. Do not copy the original failed questions.',
  mastery:'Test independent performance after learning. Do not provide hints or answer leakage. Use representative difficulty and enough variation to judge mastery.',
  exam:'Imitate the structure, pacing, difficulty, and answer conditions of the relevant real assessment as closely as the available material supports.'
}[id]}
function workingInstruction(style){return style==='concept'?`This is a no-pen-or-paper conceptual session. For Math, Physics, and Chemistry, test understanding through method selection, error detection, qualitative relationships, prediction, interpretation, classification, comparison, relevant-information recognition, and short mental calculations. Avoid long arithmetic, multi-line algebra, derivations, graph drawing, lengthy equation balancing, or any item that reasonably requires scratch work. Set "paper_required": false for every question.`:`Full written problem solving is allowed. Questions may require scratch work or multi-step calculation. Set paper_required accurately for each question.`}
function answerInstruction(format){return format==='mcq'?'Every question must be multiple choice. Do not generate short-answer, numeric-entry, or self-check questions.':'Use a useful mixture of multiple-choice, short-answer, numeric, and self-check questions. Use self-check only when automatic grading would be dishonest.'}
function timingInstruction(mode){if(mode==='ai')return'Assign a realistic positive time_limit_seconds to every question individually. Limits must reflect the actual work required; do not use one universal limit.';if(mode==='record')return'Time will be recorded without a deadline. time_limit_seconds may be omitted.';return'Timing is disabled. time_limit_seconds may be omitted.'}
function deliveryInstruction(count){return count>LARGE_PACKET_THRESHOLD?`This is a large ${count}-question packet. Create and attach a downloadable .json file. Do not paste the full JSON into the chat. The filename should be short and descriptive.`:`You may return valid JSON directly or attach a downloadable .json file. On mobile, a file is preferred when the response becomes long.`}
function createPrompt(){const s=subject(),x=DATA.setup,t=testType(x.testType);return `I want to prepare a DBD v0.9.3 packet.\n\nConfiguration:\n- Subject: ${s.name}\n- Campaign: ${s.campaign}\n- Test type: ${t.label}\n- Working style: ${label(WORKING_STYLES,x.workingStyle)}\n- Answer format: ${label(ANSWER_FORMATS,x.answerFormat)}\n- Questions: ${x.count}\n- Difficulty: ${x.difficulty}\n- Feedback in DBD: ${x.feedback==='immediate'?'Immediate':'After session'}\n- Timing in DBD: ${label(TIMINGS,x.timing)}\n- Additional focus: ${x.focus.trim()||'None'}\n\nDo not generate the packet yet. First inspect the files and conversation in this subject chat. Then ask me exactly one material-selection question. Offer 3–6 concrete scopes grounded in the actual chat, include a custom option, briefly recommend one, and wait for my choice.\n\nAfter I choose, create exactly ${x.count} questions.\n\nTest-type instruction:\n${testTypeInstruction(x.testType)}\n\nWorking-style instruction:\n${workingInstruction(x.workingStyle)}\n\nAnswer-format instruction:\n${answerInstruction(x.answerFormat)}\n\nDifficulty:\n${x.difficulty==='Adaptive'?'Use a deliberate mixture that locates my current boundary, adjusting the balance using evidence from this chat.':`Use ${x.difficulty.toLowerCase()} difficulty consistently, with defensible traps.`}\n\nTiming:\n${timingInstruction(x.timing)}\n\nOutput delivery:\n${deliveryInstruction(x.count)}\n\nAfter the material scope is confirmed, return only valid JSON or the requested JSON file. No markdown commentary around the packet.\n\nSchema:\n{\n  "dbd_version": "0.9.3",\n  "campaign": "${s.campaign}",\n  "subject": "${s.name}",\n  "topic": "selected material scope",\n  "source": "exact files, pages, lesson, test, or conversation basis",\n  "test_type": "${x.testType}",\n  "working_style": "${x.workingStyle}",\n  "answer_format": "${x.answerFormat}",\n  "difficulty": "${x.difficulty}",\n  "questions": [\n    {\n      "id": "q1",\n      "type": "mcq | short | numeric | self_check",\n      "time_limit_seconds": 90,\n      "paper_required": false,\n      "stimulus": {"type":"quote | passage | context","title":"optional","text":"optional","source":"optional"},\n      "prompt": "question text",\n      "choices": {"A":"...","B":"...","C":"...","D":"..."},\n      "answer": "A or expected response",\n      "accepted_answers": ["optional valid alternative"],\n      "tolerance": 0,\n      "explanation": "brief post-answer explanation",\n      "why_wrong": {"B":"specific misconception or trap"},\n      "tags": ["specific skill","specific subtopic"],\n      "difficulty": "easy | medium | hard"\n    }\n  ]\n}\n\nRules:\n- Use only the selected material, prior teaching, or explicit exam framework.\n- Keep explanations concise.\n- Return exactly ${x.count} questions.\n- Respect the requested answer format and working style exactly.\n- Do not include raw HTML.\n- If timing is AI-set, every question must have a positive time_limit_seconds value.`}
function generatePrompt(){DATA.generatedPrompt=createPrompt();save();route('prompt')}
function createVanillaPrompt(){return `You are preparing a DBD v0.9.3 drill packet for me. DBD is a local static website: there is no direct ChatGPT integration, no Supabase, and no cloud account.\n\nDo not generate JSON immediately. First inspect the files, recent conversation, work already completed, unresolved mistakes, and current assessment context in this chat. Then ask me one compact setup question that lets me choose:\n\n1. the material scope;\n2. one test type: Coverage Scan, Focused Drill, Deep Practice, Repair Drill, Mastery Check, or Exam Simulation;\n3. No pen or paper, or Full problem solving;\n4. Multiple choice only, or Mixed;\n5. number of questions;\n6. Easy, Medium, Difficult, or Adaptive;\n7. Immediate feedback, or After session;\n8. timing: Off, Record only, or AI-set question limits;\n9. any additional focus.\n\nRecommend sensible defaults using the evidence in this chat, but wait for my choices.\n\nAfter I answer, create a valid DBD v0.9.3 packet. For 1–15 questions, you may paste JSON or attach a .json file. For 16 or more questions, create and attach a downloadable .json file and do not paste the full packet into chat.\n\nEvery packet must include campaign, subject, topic, source, test_type, working_style, answer_format, difficulty, and questions. Every question must include id, type, prompt, answer, explanation, tags, difficulty, paper_required, and choices when it is multiple choice. Include time_limit_seconds on every question when AI-set timing is selected. Do not include raw HTML.`}
function copyVanilla(button){copyText(createVanillaPrompt(),button)}
function customizationPanel(){const x=DATA.setup;return `<details class="customization custom-drill" ${customizationOpen?'open':''} ontoggle="customizationOpen=this.open"><summary><strong>CUSTOM DRILL</strong><span class="muted">${esc(subject().name)} · ${esc(testType(x.testType).label)} · ${x.count}Q</span></summary><div class="customization-body"><div class="field" style="margin-top:14px"><label>Subject / campaign</label><select onchange="updateSetup('subjectId',this.value)">${SUBJECTS.map(i=>`<option value="${i.id}" ${i.id===x.subjectId?'selected':''}>${esc(i.campaign)} — ${esc(i.name)}</option>`).join('')}</select></div><div class="field"><label>Test type</label><div class="type-grid">${TEST_TYPES.map(t=>`<button class="type-card ${x.testType===t.id?'active':''}" onclick="selectTestType('${t.id}')"><strong>${esc(t.label)}</strong><span>${esc(t.description)}</span></button>`).join('')}</div></div><div class="setup-grid"><div class="field"><label>Working style</label><div class="choice-row">${WORKING_STYLES.map(([id,l])=>`<button class="chip ${x.workingStyle===id?'active':''}" onclick="updateSetup('workingStyle','${id}')">${esc(l)}</button>`).join('')}</div></div><div class="field"><label>Answer format</label><div class="choice-row">${ANSWER_FORMATS.map(([id,l])=>`<button class="chip ${x.answerFormat===id?'active':''}" onclick="updateSetup('answerFormat','${id}')">${esc(l)}</button>`).join('')}</div></div></div><div class="setup-grid"><div class="field"><label>Number of questions</label><div class="count-row">${COUNT_PRESETS.map(n=>`<button class="chip ${Number(x.count)===n?'active':''}" onclick="updateSetup('count',${n})">${n}</button>`).join('')}<input type="number" min="1" max="100" value="${x.count}" onchange="updateSetup('count',this.value)" aria-label="Custom question count"></div>${x.count>LARGE_PACKET_THRESHOLD?`<div class="large-note"><strong>JSON file delivery:</strong> large packets are requested as a downloadable file.</div>`:''}</div><div class="field"><label>Difficulty</label><div class="choice-row">${DIFFICULTIES.map(d=>`<button class="chip ${x.difficulty===d?'active':''}" onclick="updateSetup('difficulty','${d}')">${d}</button>`).join('')}</div></div></div><div class="setup-grid"><div class="field"><label>Feedback</label><div class="choice-row">${FEEDBACKS.map(([id,l])=>`<button class="chip ${x.feedback===id?'active':''}" onclick="updateSetup('feedback','${id}')">${esc(l)}</button>`).join('')}</div></div><div class="field"><label>Timing</label><div class="choice-row">${TIMINGS.map(([id,l])=>`<button class="chip ${x.timing===id?'active':''}" onclick="updateSetup('timing','${id}')">${esc(l)}</button>`).join('')}</div>${x.timing!=='off'?`<label style="margin-top:11px"><input style="width:auto;margin-right:8px" type="checkbox" ${x.showTimer?'checked':''} onchange="updateSetup('showTimer',this.checked)">Show timer during drill</label>`:''}</div></div><div class="field"><label>Additional focus (optional)</label><textarea placeholder="Examples: cumulative review; conceptual only; prioritize my latest mistakes..." oninput="DATA.setup.focus=this.value;save()">${esc(x.focus)}</textarea></div><button class="button primary custom-generate" onclick="generatePrompt()">GENERATE CHAT REQUEST</button></div></details>`}
function home(){return `${ongoingSessions()}<section class="panel hero home-clean"><h1>Ready to drill?</h1><div class="launch-actions"><button class="button primary" onclick="route('import')">IMPORT PACKET</button><button class="button" onclick="copyVanilla(this)">COPY VANILLA INSTRUCTION</button></div>${customizationPanel()}</section>${DATA.completedSessions.length?`<section class="panel"><div class="eyebrow">Recent activity</div><div class="activity-strip"><div class="activity-mini"><strong>${DATA.completedSessions.length}</strong><span>completed drills</span></div><div class="activity-mini"><strong>${DATA.statistics.answered}</strong><span>questions answered</span></div></div></section>`:''}` }
function secureAllTime(){const attempts=DATA.completedSessions.flatMap(s=>s.attempts||[]),eligible=attempts.filter(a=>!['skipped','unseen'].includes(a.status));if(!eligible.length)return 0;return Math.round(eligible.filter(a=>a.correct&&a.confidence==='sure').length/eligible.length*100)}
function dailyFlow(){const day=localDay(),today=DATA.completedSessions.filter(s=>localDay(new Date(s.completedAt))===day),quick=today.some(s=>deriveLegacyTestType(s)==='coverage'),main=today.some(s=>deriveLegacyTestType(s)!=='coverage'),closed=!!DATA.dailyState[day]?.closedLoop,total=today.reduce((n,s)=>n+(s.totalQuestions||s.answered||0),0),secure=today.flatMap(s=>s.attempts||[]).filter(a=>a.correct&&a.confidence==='sure').length;return `<section class="panel"><div class="eyebrow">Today’s DBD</div><div class="daily-grid"><div class="daily-card ${quick?'done':''}"><strong>1. Quick Scan</strong><div class="status">${quick?'Completed':'Not completed'}</div>${quick?'':`<button class="button tiny" style="margin-top:10px" onclick="setupDaily('quick')">SET UP 5-Q SCAN</button>`}</div><div class="daily-card ${main?'done':''}"><strong>2. Main Drill</strong><div class="status">${main?'Completed':'Not completed'}</div>${main?'':`<button class="button tiny" style="margin-top:10px" onclick="setupDaily('main')">SET UP MAIN DRILL</button>`}</div><div class="daily-card ${closed?'done':''}"><strong>3. Close the Loop</strong><div class="status">${closed?'Marked complete':'Review mistakes or send the report back'}</div><button class="button tiny" style="margin-top:10px" onclick="toggleCloseLoop()">${closed?'UNDO':'MARK DONE'}</button></div></div><p class="note" style="margin-top:12px">Today: ${total} questions · ${secure} secure correct answers. No punitive streaks.</p></section>`}
function setupDaily(kind){if(kind==='quick'){DATA.setup={...DATA.setup,testType:'coverage',...testType('coverage').defaults,count:5}}else{DATA.setup={...DATA.setup,testType:'focused',...testType('focused').defaults,count:10}}save();render();window.scrollTo({top:0,behavior:'smooth'})}
function toggleCloseLoop(){const day=localDay();DATA.dailyState[day]={...(DATA.dailyState[day]||{}),closedLoop:!DATA.dailyState[day]?.closedLoop};save();render()}
function completedCount(a){return a.responses.filter(r=>['answered','dontknow','timeout'].includes(r.status)).length}

function extractJSON(raw){let text=String(raw||'').trim();const fenced=text.match(/```(?:json)?\s*([\s\S]*?)```/i);if(fenced)text=fenced[1].trim();try{return JSON.parse(text)}catch(e){}const start=text.indexOf('{'),end=text.lastIndexOf('}');if(start>=0&&end>start)return JSON.parse(text.slice(start,end+1));throw new Error('No valid JSON packet could be found.')}
function normalizeStimulus(s){if(!s)return null;if(typeof s==='string')return{type:'context',text:s,title:'',source:''};return{type:['quote','passage','context'].includes(s.type)?s.type:'context',title:String(s.title||''),text:String(s.text||s.content||''),source:String(s.source||'')}}
function normalizeQuestion(raw,i){const prompt=raw.prompt??raw.question??raw.q??raw.text;if(!prompt)return null;let choices=raw.choices??raw.options??null;if(Array.isArray(choices)){const o={};choices.forEach((v,j)=>o[String.fromCharCode(65+j)]=String(v));choices=o}else if(choices&&typeof choices==='object'){const o={};Object.entries(choices).forEach(([k,v])=>o[String(k).toUpperCase()]=String(v));choices=o}let answer=raw.answer??raw.correct??raw.correct_answer??raw.expected_answer??'';if(choices){const match=Object.keys(choices).find(k=>norm(k)===norm(answer))||Object.keys(choices).find(k=>norm(choices[k])===norm(answer));if(match)answer=match}const accepted=Array.isArray(raw.accepted_answers)?raw.accepted_answers.map(String):[];if(answer!==''&&!accepted.some(x=>norm(x)===norm(answer)))accepted.unshift(String(answer));return{id:String(raw.id??`q${i+1}`),type:String(raw.type||(choices?'mcq':'short')),prompt:String(prompt),choices,answer:String(answer),acceptedAnswers:accepted,tolerance:Number.isFinite(Number(raw.tolerance))?Number(raw.tolerance):0,explanation:String(raw.explanation??raw.reason??''),whyWrong:raw.why_wrong??raw.whyWrong??{},tags:Array.isArray(raw.tags)?raw.tags.map(String):[],difficulty:String(raw.difficulty||''),timeLimitSeconds:Number.isFinite(Number(raw.time_limit_seconds))?Number(raw.time_limit_seconds):null,paperRequired:raw.paper_required===true,stimulus:normalizeStimulus(raw.stimulus)}}
function normalizePacket(parsed){const p=Array.isArray(parsed)?{questions:parsed}:parsed;if(!p||!Array.isArray(p.questions))throw new Error('The packet has no questions array.');const questions=p.questions.map(normalizeQuestion).filter(Boolean);if(!questions.length)throw new Error('The packet contains no valid questions.');return{dbdVersion:String(p.dbd_version||APP_VERSION),campaign:String(p.campaign||subject().campaign),subject:String(p.subject||subject().name),topic:String(p.topic||''),source:String(p.source||''),testType:String(p.test_type||DATA.setup.testType),workingStyle:String(p.working_style||DATA.setup.workingStyle),answerFormat:String(p.answer_format||DATA.setup.answerFormat),difficulty:String(p.difficulty||DATA.setup.difficulty),questions}}
function syncSetupFromPacket(p){const match=SUBJECTS.find(s=>norm(s.name)===norm(p.subject));if(match)DATA.setup.subjectId=match.id;if(TEST_TYPES.some(t=>t.id===p.testType))DATA.setup.testType=p.testType;if(WORKING_STYLES.some(x=>x[0]===p.workingStyle))DATA.setup.workingStyle=p.workingStyle;if(ANSWER_FORMATS.some(x=>x[0]===p.answerFormat))DATA.setup.answerFormat=p.answerFormat;if(DIFFICULTIES.includes(p.difficulty))DATA.setup.difficulty=p.difficulty;DATA.setup.count=p.questions.length}
function isMCQ(q){return !!(q.choices&&Object.keys(q.choices).length)}
function validatePacket(p){const errors=[],warnings=[],ids=new Set();let mcq=0,typed=0,totalLimit=0,limits=[];p.questions.forEach((q,i)=>{const n=i+1;if(!q.prompt.trim())errors.push(`Question ${n} has no prompt.`);if(ids.has(q.id))warnings.push(`Duplicate question ID: ${q.id}.`);ids.add(q.id);if(isMCQ(q)){mcq++;const keys=Object.keys(q.choices);if(keys.length<2)errors.push(`Question ${n} has fewer than two choices.`);if(!keys.some(k=>norm(k)===norm(q.answer)))errors.push(`Question ${n} has an answer that does not match any choice.`);if(new Set(keys.map(k=>norm(q.choices[k]))).size!==keys.length)warnings.push(`Question ${n} contains duplicate answer choices.`)}else{typed++;if(!['short','numeric','self_check'].includes(q.type))errors.push(`Question ${n} uses unsupported type “${q.type}”.`);if(!q.answer&&!q.acceptedAnswers.length)errors.push(`Question ${n} has no expected answer.`)}if(!q.explanation)warnings.push(`Question ${n} has no explanation.`);if(!q.tags.length)warnings.push(`Question ${n} has no skill tags.`);if(DATA.setup.answerFormat==='mcq'&&!isMCQ(q))errors.push(`Question ${n} is typed, but Multiple choice only was requested.`);if(DATA.setup.workingStyle==='concept'&&q.paperRequired)errors.push(`Question ${n} requires paper, but No pen or paper was requested.`);if(DATA.setup.timing==='ai'){if(!(q.timeLimitSeconds>0))errors.push(`Question ${n} has no positive AI-set time limit.`);else{totalLimit+=q.timeLimitSeconds;limits.push(q.timeLimitSeconds)}}});return{errors,warnings,mcq,typed,totalLimit,limits}}

function preflightSettings(){const x=DATA.setup,p=DATA.pendingPacket?.packet;if(!p)return'';return `<details class="preflight-settings" open><summary>Launch settings</summary><div class="preflight-settings-body"><div class="preflight-settings-grid"><div class="field"><label>Test type</label><select onchange="updatePreflightSetup('testType',this.value)">${TEST_TYPES.map(t=>`<option value="${t.id}" ${x.testType===t.id?'selected':''}>${esc(t.label)}</option>`).join('')}</select></div><div class="field"><label>Questions in packet</label><input value="${p.questions.length}" readonly></div><div class="field"><label>Working style</label><select onchange="updatePreflightSetup('workingStyle',this.value)">${WORKING_STYLES.map(([id,l])=>`<option value="${id}" ${x.workingStyle===id?'selected':''}>${esc(l)}</option>`).join('')}</select></div><div class="field"><label>Answer format</label><select onchange="updatePreflightSetup('answerFormat',this.value)">${ANSWER_FORMATS.map(([id,l])=>`<option value="${id}" ${x.answerFormat===id?'selected':''}>${esc(l)}</option>`).join('')}</select></div><div class="field"><label>Difficulty</label><select onchange="updatePreflightSetup('difficulty',this.value)">${DIFFICULTIES.map(d=>`<option value="${d}" ${x.difficulty===d?'selected':''}>${d}</option>`).join('')}</select></div><div class="field"><label>Feedback</label><select onchange="updatePreflightSetup('feedback',this.value)">${FEEDBACKS.map(([id,l])=>`<option value="${id}" ${x.feedback===id?'selected':''}>${esc(l)}</option>`).join('')}</select></div><div class="field"><label>Timing</label><select onchange="updatePreflightSetup('timing',this.value)">${TIMINGS.map(([id,l])=>`<option value="${id}" ${x.timing===id?'selected':''}>${esc(l)}</option>`).join('')}</select></div><div class="field"><label>Show timer</label><select onchange="updatePreflightSetup('showTimer',this.value==='yes')"><option value="yes" ${x.showTimer?'selected':''}>Yes</option><option value="no" ${!x.showTimer?'selected':''}> function calculateCorrect(q,r){if(r.status==='dontknow'||r.status==='timeout'||r.status==='skipped'||r.status==='unseen')return false;if(isMCQ(q))return norm(r.answer)===norm(q.answer);if(q.type==='numeric'){const given=Number(String(r.answer).replace(',','.')),expected=Number(String(q.answer).replace(',','.'));if(Number.isFinite(given)&&Number.isFinite(expected))return Math.abs(given-expected)<=Math.max(0,q.tolerance||0)}return q.acceptedAnswers.some(x=>norm(x)===norm(r.answer))}

function reviewView(){const a=active();if(!a)return `<div class="empty">No active drill.</div>`;const counts={answered:0,dontknow:0,skipped:0,unseen:0,flagged:0};a.responses.forEach(r=>{if(r.status==='answered'||r.status==='timeout')counts.answered++;else if(r.status==='dontknow')counts.dontknow++;else if(r.status==='skipped')counts.skipped++;else counts.unseen++;if(r.flagged)counts.flagged++});return `<section class="panel"><div class="eyebrow">Final check</div><h1 style="font-size:2rem">Review before submitting.</h1><div class="review-grid"><div class="review-stat"><strong>${counts.answered}</strong><span>answered</span></div><div class="review-stat"><strong>${counts.dontknow}</strong><span>don’t know</span></div><div class="review-stat"><strong>${counts.skipped}</strong><span>skipped</span></div><div class="review-stat"><strong>${counts.unseen}</strong><span>unseen</span></div><div class="review-stat"><strong>${counts.flagged}</strong><span>flagged</span></div></div>${counts.skipped||counts.unseen?`<div class="message info" style="margin-top:15px">You can submit with unanswered items, or return to them first.</div>`:''}<div class="navigator-grid">${a.responses.map((r,i)=>`<button class="${navClass(r,i,a.currentIndex)}" onclick="goToQuestion(${i})">${i+1}</button>`).join('')}</div><div class="actions primary-grid"><button class="button primary" onclick="finishSession()">SUBMIT SESSION</button><button class="button" onclick="goToQuestion(${a.currentIndex})">RETURN TO QUESTIONS</button></div></section>`}
function attemptFrom(q,r){const correct=['answered','dontknow','timeout'].includes(r.status)?calculateCorrect(q,r):false;return{questionId:q.id,prompt:q.prompt,stimulus:q.stimulus,type:q.type,choices:q.choices,selected:r.answer,answer:q.answer,correct,status:r.status,confidence:r.confidence,secureCorrect:correct&&r.confidence==='sure',flagged:r.flagged,elapsed:r.elapsed,errorType:r.errorType||(!correct&&r.confidence==='guess'?'guess':r.status==='dontknow'?'concept':r.status==='timeout'?'timeout':'unclassified'),note:r.note||'',comment:r.comment||'',tags:q.tags,difficulty:q.difficulty,explanation:q.explanation,whyWrong:q.whyWrong,timeLimitSeconds:q.timeLimitSeconds,paperRequired:q.paperRequired,timedOut:r.timedOut}}
function finishSession(){const a=active();if(!a)return;accrueTime();const attempts=a.packet.questions.map((q,i)=>attemptFrom(q,a.responses[i])),total=attempts.length,answered=attempts.filter(x=>['answered','dontknow','timeout'].includes(x.status)).length,correct=attempts.filter(x=>x.correct).length,secureCorrect=attempts.filter(x=>x.secureCorrect).length,wrong=attempts.filter(x=>['answered','dontknow','timeout'].includes(x.status)&&!x.correct).length,unanswered=total-answered,totalTime=a.setupSnapshot.timing==='off'?null:attempts.reduce((n,x)=>n+(x.elapsed||0),0),session={id:a.id,completedAt:new Date().toISOString(),campaign:a.packet.campaign,subject:a.packet.subject,topic:a.packet.topic,source:a.packet.source,testType:a.setupSnapshot.testType,workingStyle:a.setupSnapshot.workingStyle,answerFormat:a.setupSnapshot.answerFormat,difficulty:a.packet.difficulty||a.setupSnapshot.difficulty,feedback:a.setupSnapshot.feedback,timing:a.setupSnapshot.timing,totalQuestions:total,answered,correct,secureCorrect,wrong,unanswered,accuracy:total?correct/total*100:0,secureAccuracy:total?secureCorrect/total*100:0,totalTime,attempts,retryKind:a.retryKind||null,_packetQuestions:a.packet.questions};DATA.completedSessions.unshift(session);DATA.completedSessions=DATA.completedSessions.slice(0,200);DATA.statistics.answered+=answered;DATA.statistics.correct+=correct;DATA.statistics.wrong+=wrong;DATA.activeSessions=DATA.activeSessions.filter(x=>x.id!==a.id);DATA.currentActiveId=DATA.activeSessions[0]?.id||null;currentSessionId=session.id;save();route('summary')}

function sessionTestType(s){return testType(deriveLegacyTestType(s)).label}
function eligibleAttempts(s){return (s.attempts||[]).filter(a=>!['skipped','unseen'].includes(a.status))}
function tagStats(s){const m={};(s.attempts||[]).forEach(a=>(a.tags?.length?a.tags:['untagged']).forEach(t=>{m[t]??={total:0,correct:0,secure:0};m[t].total++;if(a.correct)m[t].correct++;if(a.secureCorrect)m[t].secure++}));return Object.entries(m).sort((a,b)=>a[1].correct/a[1].total-b[1].correct/b[1].total)}

function sessionReport(s){const tags=tagStats(s),errs=errorStats(s),c=confidenceStats(s),wrong=(s.attempts||[]).filter(a=>!a.correct&&a.status!=='skipped'&&a.status!=='unseen'),comments=(s.attempts||[]).filter(a=>a.comment);return `DBD DIAGNOSTICS\n\nCampaign: ${s.campaign}\nSubject: ${s.subject}\nTopic: ${s.topic||'—'}\nSource: ${s.source||'—'}\nTest type: ${sessionTestType(s)}\nWorking style: ${label(WORKING_STYLES,s.workingStyle)}\nAnswer format: ${label(ANSWER_FORMATS,s.answerFormat)}\nDifficulty: ${s.difficulty||'—'}\nFeedback: ${s.feedback==='immediate'?'Immediate':'After session'}\nTiming: ${label(TIMINGS,s.timing)}\n\nPerformance:\n- Total questions: ${s.totalQuestions||s.answered}\n- Correct: ${s.correct}\n- Secure correct: ${s.secureCorrect??c.sureCorrect}\n- Raw accuracy: ${Math.round(s.accuracy||0)}%\n- Secure accuracy: ${Math.round(s.secureAccuracy??((s.totalQuestions||s.answered)?c.sureCorrect/(s.totalQuestions||s.answered)*100:0))}%\n- Unanswered/skipped: ${s.unanswered??c.unanswered}${s.totalTime===null?'':`\n- Total active time: ${fmt(s.totalTime)}`}\n\nConfidence breakdown:\n- Confident correct: ${c.sureCorrect}\n- Uncertain correct: ${c.unsureCorrect}\n- Ngasal but correct: ${c.guessCorrect}\n- Incorrect: ${c.incorrect}\n- Don’t know: ${c.dontknow}\n- Skipped/unanswered: ${c.unanswered}\n\nAccuracy by tag:\n${tags.length?tags.map(([t,v])=>`- ${t}: raw ${v.correct}/${v.total}; secure ${v.secure}/${v.total}`).join('\n'):'- none'}\n\nError causes:\n${errs.length?errs.map(([e,n])=>`- ${errorLabel(e)}: ${n}`).join('\n'):'- none'}\n\nWrong questions:\n${wrong.length?wrong.map((a,i)=>`${i+1}. ${a.prompt}\nMy answer: ${a.selected||'—'}\nCorrect answer: ${a.answer}\nConfidence: ${a.confidence}\nError: ${errorLabel(a.errorType)}\nMy note: ${a.note||'—'}\nMy comment: ${a.comment||'—'}\nTags: ${a.tags?.join(', ')||'—'}`).join('\n\n'):'None.'}\n\nQuestion comments:\n${comments.length?comments.map((a,i)=>`- ${a.questionId}: ${a.comment}`).join('\n'):'- none'}${ function importBackup(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{const p=JSON.parse(await i.files[0].text());if(!p.statistics||!Array.isArray(p.completedSessions))throw new Error('Invalid DBD backup.');const d=emptyData();DATA={...d,...p,appVersion:APP_VERSION,setup:migrateSetup(p.setup),statistics:{...d.statistics,...p.statistics},completedSessions:p.completedSessions,activeSessions:Array.isArray(p.activeSessions)?p.activeSessions:(p.activeSession?[migrateLegacyActive(p.activeSession)].filter(Boolean):[]),currentActiveId:p.currentActiveId||null,dailyState:p.dailyState||{},settings:{...d.settings,...(p.settings||{})}};save();alert('Backup imported.');route('home')}catch(e){alert(e.message||'Import failed.')}};i.click()}
function resetData(){if(confirm('Delete all DBD progress from this browser?')){DATA=emptyData();save();route('home')}}
function dataView(){return `<section class="panel"><div class="eyebrow">Local persistence only</div><h1 style="font-size:2rem">No cloud accounts. Ever.</h1><div class="message"><strong>Storage key:</strong> dbd_gazali<br><br><span class="muted">DBD uses this browser’s local storage plus manual backup files. It does not connect to Supabase, ChatGPT, or any external database.</span></div><div class="actions"><button class="button primary" onclick="persistent()">REQUEST PERSISTENT STORAGE</button><button class="button" onclick="exportBackup()">EXPORT BACKUP</button><button class="button" onclick="importBackup()">IMPORT BACKUP</button><button class="button danger" onclick="resetData()">RESET DATA</button></div></section><section class="panel"><h2>Stored locally</h2><p class="muted">${DATA.activeSessions.length} ongoing session(s) · ${DATA.completedSessions.length} completed session(s)${DATA.pendingPacket?' · 1 packet waiting for launch':''}.</p></section>`}
async function copyText(text,button){try{await navigator.clipboard.writeText(text)}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}const old=button.textContent;button.textContent='COPIED ✓';setTimeout(()=>button.textContent=old,1300)}
function render(){document.body.classList.toggle('drill-mode',view==='drill');renderNav();const views={home,prompt:promptView,import:importView,preflight,drill,review:reviewView,summary,quiz:quizReport,history,data:dataView};document.getElementById('application').innerHTML=(views[view]||home)();if(view==='drill')startTimer()}
save();render();
</script>
</body>
</html>
